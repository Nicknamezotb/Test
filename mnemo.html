<title>Mnémo Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: fixed sidebar + scrolling workspace of working panels; the study card is the single focal object. */
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --surface-2:#F6F8F7; --sunken:#E8EDEA;
  --line:#DDE4E0; --line-2:#C7D1CC;
  --fg:#14201B; --fg-2:#485650; --fg-3:#76847E;
  --acc-l:#127A5C; --acc-d:#45D1A0; --accent:var(--acc-l); --on-accent:#FFFFFF;
  --good:#1C8754; --warn:#A5680B; --bad:#BF392E; --info:#2E63C6; --hard:#C2610F;
  --accent-soft:color-mix(in srgb,var(--accent) 13%,transparent);
  --accent-line:color-mix(in srgb,var(--accent) 38%,transparent);
  --shadow-1:0 1px 2px rgb(20 32 27 / .06);
  --shadow-2:0 2px 6px rgb(20 32 27 / .06),0 16px 40px rgb(20 32 27 / .10);
  --r:12px; --r-sm:8px; --pad:20px; --gap:16px;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1311; --surface:#141C19; --surface-2:#19231F; --sunken:#0A0F0D;
    --line:#232F2A; --line-2:#33423B;
    --fg:#E5EDE9; --fg-2:#A4B3AC; --fg-3:#718079;
    --accent:var(--acc-d); --on-accent:#04110B;
    --good:#4BC489; --warn:#E3AA4E; --bad:#F27468; --info:#7BA7F3; --hard:#F0954B;
    --shadow-1:0 1px 2px rgb(0 0 0 / .35);
    --shadow-2:0 2px 6px rgb(0 0 0 / .3),0 16px 40px rgb(0 0 0 / .4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1311; --surface:#141C19; --surface-2:#19231F; --sunken:#0A0F0D;
  --line:#232F2A; --line-2:#33423B;
  --fg:#E5EDE9; --fg-2:#A4B3AC; --fg-3:#718079;
  --accent:var(--acc-d); --on-accent:#04110B;
  --good:#4BC489; --warn:#E3AA4E; --bad:#F27468; --info:#7BA7F3; --hard:#F0954B;
  --shadow-1:0 1px 2px rgb(0 0 0 / .35);
  --shadow-2:0 2px 6px rgb(0 0 0 / .3),0 16px 40px rgb(0 0 0 / .4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:15px;-webkit-text-size-adjust:100%;height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);line-height:1.5;min-height:100%}
body.compact{--pad:14px;--gap:10px}
body.no-anim *,body.no-anim *::before,body.no-anim *::after{transition:none!important;animation:none!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.012em;font-weight:650}
p{margin:0}
.ic{flex:none;display:block}
.star-on .ic,.ic.fill{fill:currentColor}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.muted{color:var(--fg-3)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);font-weight:700}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:20px;padding:18px 12px 16px;border-right:1px solid var(--line);background:var(--surface);overflow-y:auto;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
.brand b{font-family:var(--f-display);font-size:1.3rem;display:block;line-height:1;font-weight:750;letter-spacing:-.02em}
.brand small{color:var(--fg-3);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;border:0;background:none;cursor:pointer;color:var(--fg-2);font-weight:700;text-align:left;width:100%;transition:background .15s,color .15s}
.nav-item:hover{background:var(--surface-2);color:var(--fg)}
.nav-item.on{background:var(--accent-soft);color:var(--accent)}
.nav-item .count{margin-left:auto;font-family:var(--f-mono);font-size:.7rem;padding:1px 7px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-weight:500}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.today-mini{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.today-mini .big{font-family:var(--f-display);font-size:1.6rem;font-weight:750;line-height:1}
.save-state{display:flex;align-items:center;gap:7px;font-size:.75rem;color:var(--fg-3);padding:0 8px}
.save-state i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.save-state.off i{background:var(--warn)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;padding:12px clamp(16px,3vw,32px);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar h1{font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.icon-btn.menu-btn{display:none}
.search{position:relative;margin-left:auto;width:min(340px,40vw)}
.search input{width:100%;padding:8px 12px 8px 34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search>.ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--fg-3);pointer-events:none}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
kbd{font-family:var(--f-mono);font-size:.7rem;padding:1px 6px;border-radius:5px;border:1px solid var(--line-2);border-bottom-width:2px;color:var(--fg-3);background:var(--surface)}
.search-pop{position:absolute;top:calc(100% + 6px);left:0;right:0;min-width:300px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-2);padding:6px;max-height:60vh;overflow:auto;z-index:50}
.search-pop h5{margin:6px 8px 4px;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.sr-item{display:flex;gap:10px;align-items:center;width:100%;padding:8px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer}
.sr-item:hover,.sr-item.on{background:var(--surface-2)}
.sr-item b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-item small{display:block;color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-item>div{min-width:0}
mark{background:color-mix(in srgb,var(--warn) 28%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.top-actions{display:flex;gap:8px}
.view{width:100%;max-width:1240px;margin:0 auto;padding:24px clamp(16px,3vw,32px) 56px;display:flex;flex-direction:column;gap:var(--gap);outline:none}
.scrim{display:none}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font-weight:700;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s,box-shadow .15s;text-decoration:none;line-height:1.2}
.btn:hover{background:var(--surface-2);border-color:var(--fg-3)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--fg));border-color:transparent}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--surface-2);border-color:transparent}
.btn-danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-danger:hover{background:color-mix(in srgb,var(--bad) 85%,#000);border-color:transparent}
.btn-sm{padding:6px 10px;font-size:.87rem;border-radius:8px}
.btn-lg{padding:12px 18px;font-size:1.05rem;border-radius:11px}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:none;color:var(--fg-2);cursor:pointer;transition:background .15s,color .15s;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--fg);border-color:var(--line)}
.icon-btn.danger:hover{color:var(--bad)}
.icon-btn.on{color:var(--warn)}
.icon-btn[disabled]{opacity:.35;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);box-shadow:var(--shadow-1);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.panel-h h2,.panel-h h3{font-size:1.08rem}
.panel-h p{color:var(--fg-3);font-size:.88rem}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:.75rem;font-weight:700;background:var(--sunken);color:var(--fg-2);white-space:nowrap;line-height:1.5}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.badge.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.badge.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.badge.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.badge.info{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.badge.outline{background:none;border:1px solid var(--line-2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.st-new{background:var(--fg-3)} .st-learning{background:var(--info)} .st-due{background:var(--warn)} .st-mastered{background:var(--good)}
.progress{height:7px;border-radius:99px;background:var(--sunken);overflow:hidden;flex:1;min-width:40px}
.progress>i{display:block;height:100%;border-radius:inherit;background:var(--accent);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.diff{display:inline-flex;gap:2px;align-items:center}
.diff i{width:6px;height:10px;border-radius:2px;background:var(--line-2)}
.diff i.on{background:var(--fg-2)}
.diff.d4 i.on,.diff.d5 i.on{background:var(--hard)}
.diff.d1 i.on,.diff.d2 i.on{background:var(--good)}
.grid{display:grid;gap:var(--gap)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:12px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:.82rem;font-weight:700;color:var(--fg-2)}
.field small{color:var(--fg-3);font-size:.78rem}
.inp,.sel,.ta{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s;min-width:0}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ta{resize:vertical;min-height:84px;line-height:1.5}
.sel{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--fg-3) 50%),linear-gradient(135deg,var(--fg-3) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px;cursor:pointer}
.inp.err,.ta.err{border-color:var(--bad)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.seg{display:inline-flex;flex-wrap:wrap;gap:3px;padding:3px;border-radius:10px;background:var(--sunken);max-width:100%}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-weight:700;font-size:.87rem;color:var(--fg-2);cursor:pointer;transition:background .15s,color .15s;white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-1)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:.85rem;cursor:pointer;color:var(--fg-2);transition:all .15s}
.chip:hover{border-color:var(--fg-3);color:var(--fg)}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.chip .ic{width:14px;height:14px}
.switch{position:relative;width:38px;height:22px;flex:none;cursor:pointer;border:0;background:var(--line-2);border-radius:99px;transition:background .2s;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0 / .25);transition:transform .2s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(16px)}
.set-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row>div:first-child{flex:1;min-width:0}
.set-row b{display:block;font-weight:700}
.set-row small{color:var(--fg-3);font-size:.84rem}
input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}
.range-row{display:grid;grid-template-columns:minmax(120px,190px) 1fr 56px;gap:12px;align-items:center}
.range-row output{font-family:var(--f-mono);font-size:.85rem;text-align:right;font-variant-numeric:tabular-nums}

/* empty / states */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:36px 20px;color:var(--fg-2)}
.empty .em-ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--sunken);color:var(--fg-3)}
.empty h3{font-size:1.08rem;color:var(--fg)}
.empty p{max-width:44ch;font-size:.92rem}
.notice{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:10px;font-size:.9rem;background:var(--surface-2);border:1px solid var(--line)}
.notice.warn{background:color-mix(in srgb,var(--warn) 10%,var(--surface));border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.notice.bad{background:color-mix(in srgb,var(--bad) 9%,var(--surface));border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.notice.good{background:color-mix(in srgb,var(--good) 9%,var(--surface));border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.notice .ic{margin-top:2px}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.01)}100%{transform:scale(1)}}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:var(--gap)}
.hero-main{display:flex;flex-direction:column;gap:14px;justify-content:center;padding:calc(var(--pad) + 6px)}
.hero-main h2{font-size:clamp(1.6rem,3vw,2.3rem);font-weight:750;letter-spacing:-.025em}
.hero-main h2 em{font-style:normal;color:var(--accent)}
.hero-main p{color:var(--fg-2);max-width:52ch}
.resume{display:flex;flex-direction:column;gap:12px}
.resume h3{font-size:1.3rem}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.kv div{display:flex;flex-direction:column;gap:1px;min-width:0}
.kv span{font-size:.75rem;color:var(--fg-3);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.kv b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .k-l{font-size:.78rem;color:var(--fg-3);font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .k-v{font-family:var(--f-display);font-size:1.75rem;font-weight:750;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .k-s{font-size:.82rem;color:var(--fg-3)}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:var(--gap)}
.due-list{display:flex;flex-direction:column}
.due-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.due-row:first-child{border-top:0}
.due-row .nm{flex:1;min-width:0}
.due-row .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due-row .nm small{color:var(--fg-3)}
.monogram{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:750;font-size:.95rem;color:#fff;background:var(--dc,var(--accent));flex:none;letter-spacing:-.02em}
.mini-bars{display:flex;align-items:flex-end;gap:5px;height:110px;padding-top:8px}
.mini-bars .mb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.mini-bars .mb i{display:block;width:100%;max-width:22px;border-radius:4px 4px 2px 2px;background:var(--accent);min-height:2px;opacity:.85}
.mini-bars .mb.today i{opacity:1;box-shadow:0 0 0 2px var(--accent-soft)}
.mini-bars .mb.zero i{background:var(--line-2)}
.mini-bars span{font-size:.66rem;color:var(--fg-3);font-family:var(--f-mono)}

/* ---------- decks ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar .inp-wrap{position:relative;flex:1;min-width:200px;max-width:360px}
.toolbar .inp-wrap .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--fg-3)}
.toolbar .inp-wrap .inp{padding-left:34px}
.toolbar .sel{width:auto}
.deck-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--gap)}
.deck{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);box-shadow:var(--shadow-1);transition:box-shadow .2s,transform .2s,border-color .2s;animation:rise .3s both}
.deck:hover{box-shadow:var(--shadow-2);border-color:var(--line-2)}
.deck-top{display:flex;gap:12px;align-items:flex-start}
.deck-id{min-width:0;flex:1}
.deck-id h3{font-size:1.1rem;cursor:pointer}
.deck-id h3:hover{color:var(--accent)}
.deck-id p{color:var(--fg-3);font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deck-badges{display:flex;flex-wrap:wrap;gap:6px}
.deck-prog{display:flex;align-items:center;gap:10px;font-size:.85rem;font-weight:700}
.deck-prog span{font-family:var(--f-mono);font-size:.8rem;min-width:38px;text-align:right}
.deck footer{display:flex;align-items:center;gap:8px;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;margin-top:auto;flex-wrap:wrap}
.deck footer .muted{font-size:.8rem}
.deck-actions{display:flex;align-items:center;gap:2px}

/* ---------- editor ---------- */
.ed-grid{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:var(--gap);align-items:start}
.ed-list{padding:0;overflow:hidden;position:sticky;top:76px;max-height:calc(100vh - 100px);display:flex;flex-direction:column}
.ed-list-h{padding:12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.ed-list-h .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--fg-3)}
.ed-list ol{list-style:none;margin:0;padding:6px;overflow-y:auto;flex:1}
.ed-item{display:flex;align-items:center;gap:8px;padding:8px 6px 8px 4px;border-radius:9px;cursor:pointer;border:1px solid transparent;position:relative;transition:background .12s}
.ed-item:hover{background:var(--surface-2)}
.ed-item.sel{background:var(--accent-soft);border-color:var(--accent-line)}
.ed-item.drag-over-top{box-shadow:inset 0 2px 0 var(--accent)}
.ed-item.drag-over-bottom{box-shadow:inset 0 -2px 0 var(--accent)}
.ed-item.dragging{opacity:.4}
.ed-item .grip{color:var(--fg-3);cursor:grab;padding:2px}
.ed-item .n{font-family:var(--f-mono);font-size:.72rem;color:var(--fg-3);width:20px;text-align:right;flex:none}
.ed-txt{flex:1;min-width:0}
.ed-txt b{display:block;font-weight:700;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-txt small{display:block;color:var(--fg-3);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.ed-move{display:none;flex-direction:column;gap:0}
.ed-item:hover .ed-move,.ed-item.sel .ed-move{display:flex}
.ed-move .icon-btn{width:22px;height:18px;border-radius:5px}
.ed-move .icon-btn .ic{width:13px;height:13px}
.ed-form{display:flex;flex-direction:column;gap:18px}
.ed-sec{display:flex;flex-direction:column;gap:12px}
.ed-sec>h4{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);font-family:var(--f-body);font-weight:700;display:flex;align-items:center;gap:8px}
.ed-sec>h4::after{content:"";flex:1;height:1px;background:var(--line)}
.tags-inp{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);align-items:center}
.tags-inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tags-inp input{border:0;outline:none;background:none;flex:1;min-width:120px;padding:3px 4px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:.8rem;font-weight:700}
.tag button{border:0;background:none;color:inherit;cursor:pointer;padding:1px;display:grid;place-items:center;border-radius:50%}
.tag button:hover{background:var(--accent-line)}
.tag.plain{padding:2px 9px;background:var(--sunken);color:var(--fg-2)}
.diff-pick{display:flex;gap:4px}
.diff-pick button{flex:1;min-width:0;padding:7px 4px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-size:.78rem;font-weight:700;cursor:pointer;color:var(--fg-2)}
.diff-pick button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt-row{display:flex;gap:8px;align-items:center}
.opt-row .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);background:none;cursor:pointer;flex:none;display:grid;place-items:center}
.opt-row .radio.on{border-color:var(--good);background:var(--good);color:#fff}
.img-prev{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);max-width:280px}
.img-prev img{display:block;width:100%}
.img-prev .icon-btn{position:absolute;top:6px;right:6px;background:var(--surface)}
.srs-box{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.srs-box div{padding:10px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line)}
.srs-box span{display:block;font-size:.72rem;color:var(--fg-3);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.srs-box b{font-variant-numeric:tabular-nums}
.leitner{display:flex;gap:3px;margin-top:4px}
.leitner i{flex:1;height:6px;border-radius:2px;background:var(--line-2)}
.leitner i.on{background:var(--accent)}
.hidden-fields{font-size:.82rem;color:var(--fg-3)}
.linkish{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.cards-table{display:flex;flex-direction:column}
.ct-row{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.6fr) minmax(0,1fr) 92px 110px;gap:14px;align-items:center;padding:11px 10px;border-top:1px solid var(--line);cursor:pointer;border-radius:8px;transition:background .12s}
.ct-row:hover{background:var(--surface-2)}
.ct-row.head{cursor:default;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);border-top:0}
.ct-row.head:hover{background:none}
.ct-row>div{min-width:0}
.ct-row .t1{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct-row .t2{color:var(--fg-2);font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct-row .tg{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.ct-row .stc{display:flex;align-items:center;gap:6px;font-size:.84rem}

/* ---------- flashcard ---------- */
.flash{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-2);padding:clamp(20px,4vw,40px);display:flex;flex-direction:column;gap:20px;min-height:340px;animation:cardIn .35s cubic-bezier(.2,.7,.2,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.flash-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flash-front{display:flex;flex-direction:column;gap:12px}
.flash .term{font-family:var(--f-display);font-size:clamp(1.6rem,3.6vw,2.3rem);font-weight:750;letter-spacing:-.02em;line-height:1.1}
.flash .q{font-size:clamp(1.12rem,2.2vw,1.4rem);line-height:1.45;font-weight:700}
.flash .term+.q{font-size:1.02rem;font-weight:400;color:var(--fg-2)}
.flash img.card-img{max-height:220px;width:auto;max-width:100%;border-radius:10px;border:1px solid var(--line);align-self:flex-start}
.blank{display:inline-block;min-width:4.5em;border-bottom:2.5px solid var(--accent);margin:0 2px;color:transparent;line-height:1.1}
.blank.filled{color:var(--accent);min-width:0;padding:0 3px;background:var(--accent-soft);border-radius:4px 4px 0 0}
.hint-box{display:flex;gap:8px;align-items:center;font-size:.92rem;color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,transparent);padding:8px 12px;border-radius:9px;align-self:flex-start;animation:rise .2s both}
.flash-back{border-top:1.5px dashed var(--line-2);padding-top:20px;display:flex;flex-direction:column;gap:14px;animation:rise .3s both}
.flash-back .ans{font-size:clamp(1.12rem,2.3vw,1.4rem);font-weight:700;line-height:1.4;color:var(--fg)}
.fb-field{display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;font-size:.96rem}
.fb-field>span{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);padding-top:3px}
.fb-field.imp>div{color:var(--accent);font-weight:700}
.fb-field.err>div{color:var(--bad)}
.mcq{display:grid;gap:8px}
.mcq button{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:11px;border:1.5px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:700;transition:all .15s}
.mcq button:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.mcq button kbd{flex:none}
.mcq button[disabled]{cursor:default}
.mcq button.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.mcq button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf button{padding:14px;font-size:1.05rem}
.study{max-width:780px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.study-top{display:flex;flex-direction:column;gap:10px}
.study-stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sstat{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:.84rem;font-weight:700;color:var(--fg-2)}
.sstat b{color:var(--fg);font-family:var(--f-mono);font-weight:500}
.study-bar{height:8px}
.reveal-zone{display:flex;flex-direction:column;align-items:center;gap:12px}
.grade-q{font-weight:700;color:var(--fg-2);text-align:center}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%}
.grade{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 8px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:700;transition:transform .12s,border-color .15s,background .15s}
.grade:hover{transform:translateY(-2px)}
.grade small{font-family:var(--f-mono);font-size:.74rem;color:var(--fg-3);font-weight:400}
.grade kbd{margin-top:3px}
.grade.g0{color:var(--bad)} .grade.g0:hover{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.grade.g1{color:var(--hard)} .grade.g1:hover{border-color:var(--hard);background:color-mix(in srgb,var(--hard) 8%,transparent)}
.grade.g2{color:var(--good)} .grade.g2:hover{border-color:var(--good);background:color-mix(in srgb,var(--good) 8%,transparent)}
.grade.g3{color:var(--info)} .grade.g3:hover{border-color:var(--info);background:color-mix(in srgb,var(--info) 8%,transparent)}
.grade.sugg{box-shadow:0 0 0 3px var(--accent-soft)}
.kbd-hints{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:.8rem;color:var(--fg-3)}
.setup{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:var(--gap);align-items:start}
.pick-list{display:grid;gap:8px}
.pick{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%;transition:border-color .15s,background .15s}
.pick:hover{border-color:var(--line-2)}
.pick.on{border-color:var(--accent);background:var(--accent-soft)}
.pick .nm{flex:1;min-width:0}
.pick .nm b{display:block}
.pick .nm small{color:var(--fg-3)}
.ivl-table{display:grid;gap:0;font-size:.9rem}
.ivl-table>div{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.ivl-table>div:first-child{border-top:0}
.summary-big{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.summary-big div{padding:14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.summary-big span{display:block;font-size:.75rem;color:var(--fg-3);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.summary-big b{font-family:var(--f-display);font-size:1.6rem;font-weight:750}
.dist{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--sunken)}
.dist i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------- stats ---------- */
.kpis6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--gap)}
.chart{position:relative}
.bars{overflow-x:clip;display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;height:var(--h,190px)}
.bars-y{position:relative;font-family:var(--f-mono);font-size:.68rem;color:var(--fg-3);height:calc(100% - 20px)}
.bars-y span{position:absolute;right:0;transform:translateY(50%)}
.bars-plot{position:relative;display:flex;align-items:stretch;gap:3px;height:100%}
.bars-plot .grid-l{position:absolute;left:0;right:0;border-top:1px dashed var(--line);pointer-events:none}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0;position:relative}
.bstack{flex:1;width:100%;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;position:relative;z-index:1}
.bstack i{display:block;width:72%;max-width:26px;transition:height .5s cubic-bezier(.2,.7,.2,1)}
.bstack i:last-child{border-radius:4px 4px 0 0}
.bcol:hover .bstack i{filter:brightness(1.12)}
.bx{height:20px;font-size:.66rem;color:var(--fg-3);font-family:var(--f-mono);padding-top:4px;white-space:nowrap}
.btip{position:absolute;bottom:calc(100% - 14px);left:50%;transform:translate(-50%,-6px);background:var(--fg);color:var(--bg);font-size:.75rem;padding:5px 8px;border-radius:7px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;z-index:5}
.bcol:hover .btip{opacity:1}
.bcol:first-of-type .bx{align-self:flex-start}.bcol:last-child .bx{align-self:flex-end}
.bcol:first-of-type .btip{left:0;transform:translate(0,-6px)}.bcol:last-child .btip{left:auto;right:0;transform:translate(0,-6px)}
.line-chart{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;height:190px}
.line-plot{position:relative;height:calc(100% - 20px)}
.line-plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.line-plot .grid-l{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.line-plot .end-dot{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2.5px solid var(--surface);transform:translate(-50%,-50%);box-shadow:0 0 0 1px var(--accent)}
.line-plot .end-lbl{position:absolute;transform:translate(-100%,-150%);font-family:var(--f-mono);font-size:.75rem;font-weight:500;color:var(--accent);white-space:nowrap}
.line-x{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.66rem;color:var(--fg-3);padding-top:6px}
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:minmax(80px,130px) minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:.88rem}
.hbar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;color:var(--fg-2)}
.hbar .track{height:10px;border-radius:99px;background:var(--sunken);overflow:hidden}
.hbar .track i{display:block;height:100%;border-radius:inherit;background:var(--accent)}
.hbar>span:last-child{font-family:var(--f-mono);font-size:.8rem;text-align:right}
.deck-table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:560px}
.deck-table th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);text-align:left;padding:8px 10px;font-weight:700}
.deck-table td{padding:10px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}

/* ---------- generator ---------- */
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:9px;padding:7px 12px 7px 7px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.88rem;color:var(--fg-3);cursor:pointer;transition:all .15s}
.step i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-mono);font-size:.75rem;background:var(--sunken);color:var(--fg-2)}
.step.on{border-color:var(--accent);color:var(--fg)}
.step.on i{background:var(--accent);color:var(--on-accent)}
.step.done i{background:var(--accent-soft);color:var(--accent)}
.step.done{color:var(--fg-2)}
.step[disabled]{opacity:.45;cursor:not-allowed}
.gen-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--gap);align-items:start}
.gen-aside{position:sticky;top:76px;display:flex;flex-direction:column;gap:var(--gap)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.mode{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;transition:all .15s}
.mode:hover{border-color:var(--line-2);transform:translateY(-1px)}
.mode.on{border-color:var(--accent);background:var(--accent-soft)}
.mode .ic{color:var(--accent)}
.mode b{font-size:.93rem}
.mode small{color:var(--fg-3);font-size:.78rem;line-height:1.35}
.an-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.an-grid div{padding:9px 10px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line)}
.an-grid b{display:block;font-family:var(--f-display);font-size:1.3rem;font-weight:750;line-height:1.1;font-variant-numeric:tabular-nums}
.an-grid span{font-size:.75rem;color:var(--fg-3);font-weight:700}
.est-big{display:flex;align-items:baseline;gap:8px}
.est-big b{font-family:var(--f-display);font-size:2.4rem;font-weight:750;line-height:1;letter-spacing:-.03em}
.split3{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px}
.split3 i{display:block;height:100%}
.ctl{display:flex;flex-direction:column;gap:9px}
.ctl-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ctl-h b{font-weight:700}
.ctl-h small{color:var(--fg-3)}
.struct{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
.struct-col{display:flex;flex-direction:column;gap:2px}
.tg-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tg-row:first-of-type{border-top:0}
.tg-row>div{flex:1;min-width:0}
.tg-row b{display:block;font-weight:700;font-size:.93rem}
.tg-row small{color:var(--fg-3);font-size:.8rem}
.gen-load{display:flex;flex-direction:column;gap:12px;padding:10px 0}
.gl-step{display:flex;gap:12px;align-items:center;color:var(--fg-3);font-weight:700}
.gl-step.done{color:var(--fg-2)}
.gl-step.cur{color:var(--fg)}
.gl-step .ok{width:18px;height:18px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;flex:none}
.gl-step .wait{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);flex:none}
.gp-list{display:flex;flex-direction:column;gap:10px}
.gp{display:flex;gap:12px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);transition:opacity .2s,border-color .2s;animation:rise .3s both}
.gp.off{opacity:.5}
.gp .chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--line-2);background:none;cursor:pointer;flex:none;display:grid;place-items:center;margin-top:2px}
.gp .chk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.gp-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.gp-body .f{font-weight:700}
.gp-body .b{color:var(--fg-2);font-size:.92rem}
.gp-body .opts{display:flex;flex-wrap:wrap;gap:5px}
.gp-acts{display:flex;flex-direction:column;gap:2px}
.manual-rows{display:flex;flex-direction:column;gap:8px}
.manual-row{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 32px;gap:8px;align-items:center}
.manual-row .n{font-family:var(--f-mono);font-size:.75rem;color:var(--fg-3);text-align:right}

/* ---------- import ---------- */
.dropzone{border:1.5px dashed var(--line-2);border-radius:12px;padding:18px;display:flex;align-items:center;gap:14px;background:var(--surface-2);transition:border-color .15s,background .15s;flex-wrap:wrap}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.map-table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:520px}
.map-table th,.map-table td{padding:8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.map-table th{border-top:0;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3)}
.map-table td.smp{color:var(--fg-2);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prev-table{width:100%;border-collapse:collapse;font-size:.85rem;min-width:520px}
.prev-table th,.prev-table td{padding:7px 8px;border-top:1px solid var(--line);text-align:left;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prev-table th{border-top:0;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3)}
.out{font-family:var(--f-mono);font-size:.8rem;min-height:240px;white-space:pre;overflow:auto}

/* ---------- modal & toast ---------- */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgb(8 14 12 / .5);display:grid;place-items:center;padding:16px;animation:fade .15s both;backdrop-filter:blur(2px)}
@keyframes fade{from{opacity:0}}

function newSrs(){return {reps:0,ivl:0,ease:2.5,lapses:0,due:0,last:0,lastGrade:null};}
function schedule(srs,g,now){
  const s=Object.assign(newSrs(),srs||{});
  let ivl=s.ivl,ease=s.ease;
  if(g===0){ease=Math.max(1.3,ease-0.2);s.lapses++;ivl=10/1440;}
  else if(ivl<1){ivl=[0,1/24,1,4][g];if(g===1)ease=Math.max(1.3,ease-0.15);if(g===3)ease+=0.15;}
  else if(g===1){ivl=Math.max(ivl+1,ivl*1.2);ease=Math.max(1.3,ease-0.15);}
  else if(g===2){ivl=Math.max(ivl+1,ivl*ease);}
  else{ivl=Math.max(ivl+3,ivl*ease*1.3);ease+=0.15;}
  if(g>0&&ivl>=1)ivl=Math.round(ivl);
  ivl=Math.min(ivl,3650);
  s.reps++;s.due=now+ivl*DAY;s.ivl=g===0?0:Math.round(ivl*1000)/1000;s.ease=Math.round(ease*100)/100;s.last=now;s.lastGrade=g;
  return s;
}

rk Interface Card).","tags":["vocabulaire"],"d":1},{"t":"qa","q":"Que désignent « port physique » et « interface » ?","a":"Port physique : connecteur d'un équipement où l'on branche le support. Interface : port spécialisé d'un équipement réseau qui le relie à un réseau.","expl":"Avec la NIC (carte réseau), ce sont les 3 termes de vocabulaire du module.","tags":["vocabulaire"],"d":2},{"t":"qa","q":"Quelle différence entre topologie physique et topologie logique ?","a":"Physique : emplacement des équipements et câblage. Logique : adresses, ports et interfaces.","err":"Confondre les deux : le câblage relève de la topologie physique.","tags":["vocabulaire"],"d":3},{"t":"term","term":"SOHO","a":"Small Office / Home Office : réseau d'un petit bureau ou d'une maison.","tags":["types de réseaux"],"d":2},{"t":"qa","q":"Quels types de réseaux distingue-t-on selon leur taille ?","a":"Réseau domestique, SOHO (petit bureau/maison), moyen ou grand réseau d'entreprise, réseau mondial.","tags":["types de réseaux"],"d":2},{"t":"qa","q":"Quelle différence entre un LAN et un WAN ?","a":"LAN : réseau local sur une zone limitée, géré par une seule organisation. WAN : réseau étendu sur de grandes distances, souvent opéré par des fournisseurs.","tags":["types de réseaux"],"d":2,"star":true},{"t":"term","term":"Internet","a":"Ensemble de LAN et de WAN interconnectés, qui n'appartient à personne.","expl":"Il est coordonné par l'IETF, l'ICANN et l'IAB.","tags":["types de réseaux"],"d":1},{"t":"tf","q":"Internet appartient à l'ICANN.","tf":false,"expl":"Internet n'appartient à personne. Il est coordonné par l'IETF, l'ICANN et l'IAB.","tags":["types de réseaux","pièges"],"d":3},{"t":"mcq","q":"Quels organismes coordonnent Internet ?","opts":["IETF, ICANN et IAB","IEEE, ISO et ITU","Cisco, IETF et W3C","L'ICANN uniquement"],"ok":0,"tags":["types de réseaux"],"d":4},{"t":"qa","q":"Quelle différence entre intranet et extranet ?","a":"Intranet : réseau privé interne à une organisation. Extranet : accès contrôlé donné à des tiers (clients, partenaires).","err":"Inverser les deux termes.","tags":["types de réseaux"],"d":3},{"t":"qa","q":"Quels sont les modes d'accès à Internet à domicile ?","a":"Câble, DSL, cellulaire, satellite, dial-up.","tags":["accès Internet"],"d":2},{"t":"qa","q":"Quels sont les modes d'accès à Internet en entreprise ?","a":"Ligne louée dédiée, Metro Ethernet, DSL professionnel (SDSL), satellite.","tags":["accès Internet"],"d":3},{"t":"term","term":"Réseau convergent","a":"Réseau où voix, vidéo et données passent sur la même infrastructure.","tags":["accès Internet"],"d":2},{"t":"qa","q":"Quelles sont les 4 caractéristiques d'une architecture réseau fiable ?","a":"Tolérance aux pannes, évolutivité, QoS (qualité de service), sécurité.","tags":["architecture"],"d":2,"star":true},{"t":"mcq","q":"Quelle caractéristique repose sur la commutation de paquets et la redondance ?","opts":["La tolérance aux pannes","L'évolutivité","La QoS","La sécurité"],"ok":0,"expl":"Elle permet au réseau de continuer à fonctionner malgré une panne.","tags":["architecture"],"d":3},{"t":"term","term":"Tolérance aux pannes","a":"Le réseau continue de fonctionner malgré une panne, grâce à la commutation de paquets et à la redondance.","tags":["architecture"],"d":2},{"t":"term","term":"Évolutivité (scalability)","a":"Capacité du réseau à grandir sans dégrader les performances.","tags":["architecture"],"d":2},{"t":"term","term":"QoS (qualité de service)","a":"Priorité donnée au trafic sensible, comme la voix et la vidéo.","tags":["architecture"],"d":2},{"t":"cloze","q":"La sécurité d'un réseau vise la confidentialité, l'{{intégrité}} et la {{disponibilité}}.","tags":["architecture","sécurité"],"d":3},{"t":"term","term":"BYOD","a":"Bring Your Own Device : chacun apporte et utilise son propre appareil.","tags":["tendances"],"d":1},{"t":"qa","q":"Quels sont les types de cloud computing ?","a":"Public, privé, hybride et personnalisé.","tags":["tendances"],"d":3},{"t":"qa","q":"Cite les autres tendances réseau du module.","a":"Collaboration en ligne, communications vidéo, maison connectée, réseau par courant porteur (powerline), haut débit sans fil (WISP).","tags":["tendances"],"d":4},{"t":"qa","q":"Cite des menaces externes.","a":"Virus, vers, chevaux de Troie, spyware/adware, attaques zero-day, attaquants (threat actors), déni de service (DoS), interception ou vol de données, usurpation d'identité.","tags":["sécurité"],"d":3},{"t":"qa","q":"Cite les menaces internes.","a":"Appareils perdus ou volés, mauvaise utilisation accidentelle, employé malveillant.","tags":["sécurité"],"d":2},{"t":"tf","q":"Un employé malveillant est une menace externe.","tf":false,"expl":"C'est une menace interne, comme les appareils perdus ou volés et la mauvaise utilisation accidentelle.","tags":["sécurité","pièges"],"d":2},{"t":"qa","q":"Quelles solutions de sécurité à la maison et en entreprise ?","a":"Maison : antivirus, antispyware, pare-feu. Entreprise : pare-feu dédié, ACL, IPS, VPN.","tags":["sécurité"],"d":3}],"aliases":["Module 1 — Les réseaux aujourd'hui"]},{"name":"Module 2 — Configuration de base d'un switch et d'un hôte","subject":"Réseaux","chapter":"Module 2 : Basic Switch and End Device Configuration","theme":"Cisco IOS, configuration de base, sauvegarde, adressage IP","level":"Supérieur — Licence","lang":"Français","color":"#2B59C3","cards":[{"t":"qa","q":"Quels sont les 3 composants d'un système d'exploitation ?","a":"Le shell (interface CLI ou GUI), le noyau (kernel) et le matériel.","tags":["OS"],"d":2},{"t":"term","term":"Noyau (kernel)","a":"Partie de l'OS qui fait le lien entre le matériel et le logiciel.","tags":["OS"],"d":2},{"t":"qa","q":"Pourquoi configure-t-on les équipements réseau en CLI plutôt qu'en GUI ?","a":"La GUI (icônes, menus, fenêtres) est conviviale mais peut planter ; les équipements réseau se configurent donc en CLI, au clavier.","tags":["OS"],"d":2},{"t":"qa","q":"Quelles sont les 3 méthodes d'accès à un équipement Cisco ?","a":"Console, SSH et Telnet.","tags":["accès"],"d":1},{"t":"term","term":"Console","a":"Port physique de gestion, utilisé pour la configuration initiale.","tags":["accès"],"d":2},{"t":"mcq","q":"Quelle méthode d'accès distant est recommandée ?","opts":["SSH","Telnet","Console","AUX"],"ok":0,"expl":"SSH est sécurisé, contrairement à Telnet.","tags":["accès"],"d":1},{"t":"tf","q":"Telnet chiffre les identifiants et les commandes.","tf":false,"expl":"Telnet n'est pas sécurisé : identifiants et commandes passent en clair. Préférer SSH.","tags":["accès","pièges"],"d":2,"star":true},{"t":"qa","q":"Cite des émulateurs de terminal.","a":"PuTTY, Tera Term, SecureCRT.","tags":["accès"],"d":2},{"t":"mcq","q":"À quel mode correspond le prompt Switch# ?","opts":["Privileged EXEC","User EXEC","Configuration globale","Config interface"],"ok":0,"tags":["modes"],"d":2},{"t":"qa","q":"Mode User EXEC : quel prompt et quel rôle ?","a":"Prompt Switch> : commandes de supervision de base, limitées.","tags":["modes"],"d":2},{"t":"qa","q":"Mode Privileged EXEC : quel prompt et quel rôle ?","a":"Prompt Switch# : accès à toutes les commandes.","tags":["modes"],"d":2},{"t":"cloze","q":"Le prompt du mode configuration globale est {{Switch(config)#}}.","tags":["modes"],"d":3,"expl":"Ce mode donne accès aux options de configuration de l'équipement."},{"t":"qa","q":"Mode config ligne : quel prompt et quel usage ?","a":"Switch(config-line)# : configurer les lignes console, SSH, Telnet et AUX.","tags":["modes"],"d":3},{"t":"qa","q":"Mode config interface : quel prompt et quel usage ?","a":"Switch(config-if)# : configurer un port de switch ou une interface de routeur.","tags":["modes"],"d":3},{"t":"tf","q":"Une commande IOS peut s'exécuter depuis n'importe quel mode.","tf":false,"expl":"Chaque commande a une syntaxe précise et ne s'exécute que dans le bon mode.","tags":["modes","pièges"],"d":2},{"t":"qa","q":"Quelle commande fait passer de User EXEC à Privileged EXEC ?","a":"enable","tags":["navigation"],"d":1},{"t":"qa","q":"Quelle commande fait entrer en configuration globale ?","a":"configure terminal (abrégée conf t)","tags":["navigation"],"d":1},{"t":"qa","q":"Quelle commande fait entrer dans la configuration de la ligne console ?","a":"line console 0","tags":["navigation"],"d":2},{"t":"qa","q":"Quelle commande fait entrer dans la configuration de l'interface FastEthernet 0/1 ?","a":"interface fastEthernet 0/1","tags":["navigation"],"d":2},{"t":"tf","q":"La commande exit ramène directement au mode Privileged EXEC.","tf":false,"expl":"exit remonte d'un seul niveau. end ou Ctrl+Z ramènent directement au mode Privileged EXEC.","tags":["navigation","pièges"],"d":3,"star":true},{"t":"qa","q":"Comment revenir directement au mode Privileged EXEC depuis un mode de configuration ?","a":"end ou Ctrl+Z.","tags":["navigation"],"d":2},{"t":"concept","term":"Structure d'une commande IOS","q":"Décris-la.","a":"Prompt + commande + espace + mot-clé ou argument.","ex":"ping 192.168.10.5 ; traceroute 192.168.10.5","tags":["commandes"],"d":3},{"t":"qa","q":"Quelle différence entre un mot-clé et un argument ?","a":"Mot-clé : paramètre prédéfini par l'IOS (ex. ip protocols). Argument : valeur fournie par l'utilisateur (ex. 192.168.10.5).","err":"Inverser les deux notions.","tags":["commandes"],"d":4},{"t":"qa","q":"Donne deux exemples de commandes suivies d'un argument.","a":"ping ip-address et traceroute ip-address.","tags":["commandes"],"d":2},{"t":"qa","q":"Comment obtenir l'aide contextuelle dans l'IOS ?","a":"En tapant ?","tags":["aide et raccourcis"],"d":1},{"t":"qa","q":"Que signifie « % Invalid input detected at '^' marker » ?","a":"Une erreur de syntaxe : le ^ indique l'endroit où la commande est incorrecte.","tags":["aide et raccourcis"],"d":3},{"t":"tf","q":"On peut abréger une commande tant qu'elle reste non ambiguë, par exemple conf t.","tf":true,"tags":["aide et raccourcis"],"d":2},{"t":"qa","q":"À quoi sert la touche Tab ?","a":"À compléter la commande ou le mot-clé.","tags":["aide et raccourcis"],"d":1},{"t":"qa","q":"Comment rappeler la commande précédente ?","a":"Flèche haut ou Ctrl+P.","tags":["aide et raccourcis"],"d":2},{"t":"qa","q":"Comment déplacer le curseur dans la ligne de commande ?","a":"Flèche gauche ou Ctrl+B ; flèche droite ou Ctrl+F.","tags":["aide et raccourcis"],"d":3},{"t":"qa","q":"À quoi servent Ctrl+C et Ctrl+Z ?","a":"À sortir du mode configuration.","tags":["aide et raccourcis"],"d":3},{"t":"mcq","q":"Quel raccourci interrompt un ping ou un traceroute ?","opts":["Ctrl+Shift+6","Ctrl+C","Ctrl+Z","Échap"],"ok":0,"err":"Confondre avec Ctrl+C / Ctrl+Z, qui font sortir du mode configuration.","tags":["aide et raccourcis"],"d":4},{"t":"qa","q":"Devant --More--, que font Entrée et Espace ?","a":"Entrée affiche la ligne suivante ; Espace affiche l'écran suivant.","tags":["aide et raccourcis"],"d":3},{"t":"qa","q":"Quelle commande donne un nom d'hôte à un équipement ?","a":"hostname suivi du nom (ex. hostname Sw-Floor-1). no hostname rétablit le nom par défaut.","tags":["configuration de base"],"d":1},{"t":"qa","q":"Quelles règles doit respecter un nom d'hôte ?","a":"Commencer par une lettre, finir par une lettre ou un chiffre, ni espaces ni caractères spéciaux (sauf tirets), moins de 64 caractères.","tags":["configuration de base"],"d":3},{"t":"tf","q":"« 1-Switch » est un nom d'hôte valide.","tf":false,"expl":"Un nom d'hôte doit commencer par une lettre.","tags":["configuration de base","pièges"],"d":3},{"t":"qa","q":"Quelles sont les bonnes pratiques pour les mots de passe ?","a":"Plus de 8 caractères, mélange de majuscules, minuscules, chiffres et caractères spéciaux, pas de mots courants, un mot de passe différent par équipement.","imp":"« cisco » et « class » sont réservés aux labs : à éviter en production.","tags":["mots de passe"],"d":2},{"t":"qa","q":"Comment sécuriser l'accès User EXEC par la console ?","a":"line console 0, puis password xxx, puis login.","tags":["mots de passe"],"d":3},{"t":"qa","q":"Comment sécuriser l'accès au mode Privileged EXEC ?","a":"enable secret xxx","tags":["mots de passe"],"d":2,"star":true},{"t":"cloze","q":"Pour sécuriser l'accès distant : line vty {{0 15}}, puis password xxx, puis {{login}}.","tags":["mots de passe"],"d":4},{"t":"term","term":"Lignes VTY","a":"Lignes d'accès distant (Telnet/SSH), numérotées de 0 à 15.","tags":["mots de passe"],"d":3},{"t":"qa","q":"Quelle commande chiffre les mots de passe ?","a":"service password-encryption (vérification avec show running-config).","tags":["mots de passe"],"d":2},{"t":"qa","q":"Comment configurer une bannière ?","a":"banner motd #Authorized Access Only!#","expl":"Le # sert de délimiteur.","tags":["configuration de base"],"d":3},{"t":"qa","q":"Que comprend la configuration de base d'un équipement ?","a":"Le nom d'hôte, les mots de passe, leur chiffrement et la bannière.","imp":"Puis sauvegarder la running-config dans la startup-config.","tags":["configuration de base"],"d":2},{"t":"qa","q":"Quelle différence entre startup-config et running-config ?","a":"startup-config : en NVRAM, conservée à l'extinction, chargée au démarrage. running-config : en RAM, configuration active, perdue au redémarrage, modifications appliquées immédiatement.","tags":["sauvegarde"],"d":3,"star":true},{"t":"mcq","q":"Où est stockée la startup-config ?","opts":["En NVRAM","En RAM","En mémoire flash","En ROM"],"ok":0,"tags":["sauvegarde"],"d":2},{"t":"tf","q":"La running-config est conservée après un redémarrage.","tf":false,"expl":"Elle est en RAM et perdue au redémarrage : il faut la sauvegarder dans la startup-config.","tags":["sauvegarde","pièges"],"d":2},{"t":"qa","q":"Quelle commande sauvegarde la configuration active ?","a":"copy running-config startup-config","tags":["sauvegarde"],"d":1,"star":true,"imp":"Tout équipement doit avoir sa running-config sauvegardée dans la startup-config, et chaque hôte doit avoir une adresse IP."},{"t":"qa","q":"Quelles sont les 3 façons d'annuler des modifications ?","a":"Supprimer les commandes une par une ; reload (coupure brève du réseau) ; erase startup-config puis reload si les changements étaient déjà sauvegardés.","tags":["sauvegarde"],"d":4},{"t":"qa","q":"Comment capturer la configuration dans un fichier texte avec PuTTY ?","a":"1. Activer le logging (« All session output ») et choisir un nom de fichier. 2. Lancer show running-config. 3. Désactiver le logging (« None »).","tags":["sauvegarde"],"d":4},{"t":"qa","q":"Quel est le format d'une adresse IPv4 ?","a":"32 bits, en notation décimale pointée : 4 nombres de 0 à 255.","tags":["adressage IP"],"d":1},{"t":"term","term":"Masque de sous-réseau","a":"Sépare la partie réseau de la partie hôte d'une adresse IPv4.","tags":["adressage IP"],"d":2},{"t":"term","term":"Passerelle par défaut","a":"Adresse du routeur qui donne accès aux autres réseaux, dont Internet.","tags":["adressage IP"],"d":2},{"t":"qa","q":"Quel est le format d'une adresse IPv6 ?","a":"128 bits : 32 chiffres hexadécimaux en groupes de 4 séparés par « : », insensible à la casse. IPv6 remplace progressivement IPv4.","tags":["adressage IP"],"d":2},{"t":"mcq","q":"Combien de bits compte une adresse IPv6 ?","opts":["128","32","64","256"],"ok":0,"tags":["adressage IP"],"d":1},{"t":"qa","q":"Selon quels critères les supports de transmission diffèrent-ils ?","a":"Distance, environnement d'installation, débit et coût.","ex":"Paires torsadées cuivre, fibre, coaxial, sans fil.","tags":["supports"],"d":3},{"t":"qa","q":"Que faut-il renseigner pour configurer manuellement l'IP d'un poste ?","a":"Adresse IP, masque de sous-réseau, passerelle par défaut et DNS.","tags":["adressage IP"],"d":2},{"t":"tf","q":"La plupart des postes sont configurés par défaut avec une adresse IP manuelle.","tf":false,"expl":"Par défaut, la plupart des postes utilisent DHCP.","tags":["adressage IP","pièges"],"d":2},{"t":"qa","q":"Quels mécanismes attribuent automatiquement une adresse IPv6 ?","a":"DHCPv6 et SLAAC.","tags":["adressage IP"],"d":3},{"t":"term","term":"SVI (interface virtuelle du switch)","a":"Interface virtuelle qui sert à administrer le switch à distance.","tags":["SVI"],"d":3},{"t":"qa","q":"Quelles commandes configurent la SVI du VLAN 1 ?","a":"interface vlan 1, puis ip address 192.168.1.20 255.255.255.0, puis no shutdown.","err":"Oublier no shutdown : l'interface reste désactivée.","tags":["SVI"],"d":4}],"aliases":["Module 2 — Cisco IOS : accès, modes et commandes","Module 2 — Configuration de base et adressage IP"]},{"name":"Module 3 — Protocoles et modèles","subject":"Réseaux","chapter":"Module 3 : Protocols and Models","theme":"Règles, protocoles, OSI et TCP/IP, encapsulation, adressage","level":"Supérieur — Licence","lang":"Français","color":"#BD4A2F","cards":[{"t":"qa","q":"Quels sont les 3 éléments de toute communication ?","a":"Une source (émetteur), une destination (récepteur) et un canal (média).","tags":["règles de communication"],"d":1},{"t":"term","term":"Protocole","a":"Ensemble de règles qui encadrent la communication.","tags":["règles de communication"],"d":1},{"t":"qa","q":"Que prévoient les protocoles de communication ?","a":"Émetteur et récepteur identifiés, langage et grammaire communs, vitesse et timing de livraison, accusés de réception.","tags":["règles de communication"],"d":3},{"t":"term","term":"Encodage","a":"Conversion de l'information sous une forme adaptée à la transmission. Le décodage fait l'inverse.","ex":"Les messages sont convertis en bits, puis encodés en lumière, son ou impulsions électriques.","tags":["règles de communication"],"d":2},{"t":"qa","q":"Que signifient « formatage et encapsulation » d'un message ?","a":"Le message suit un format précis, selon son type et le canal utilisé.","ex":"Comme une lettre dans une enveloppe, ou un en-tête IPv6 de 40 octets.","tags":["règles de communication"],"d":3},{"t":"cloze","q":"Un en-tête IPv6 fait {{40}} octets.","tags":["règles de communication"],"d":3},{"t":"qa","q":"Que dit la règle de « ta function seedDemo(){
  const now=Date.now();const decks=[],cards=[];
  DEMO.forEach((D,i)=>{const created=now-(3-i)*MIN;
    const deck={id:uid(),name:D.name,subject:D.subject,chapter:D.chapter,theme:D.theme,level:D.level,lang:D.lang,color:D.color,fields:{...DEFAULT_FIELDS,src:true},created,updated:created,lastStudied:0};
    decks.push(deck);D.cards.forEach((c,j)=>cards.push(makeCard(deck.id,{...c,src:SRC_NET},j,created)));});
  return {v:2,contentV:CONTENT_V,decks,cards,history:[],sessions:[],settings:defaultSettings()};
}
/* Met à jour les decks Réseaux existants sans perdre la progression */
function syncContent(db){
  if((db.contentV||0)>=CONTENT_V) return false;
  const now=Date.now();const k=c=>norm(c.q)+'|'+norm(c.term);
  const byKey=new Map(db.cards.map(c=>[k(c),c]));
  const C=['type','term','q','hint','a','expl','ex','imp','err','opts','ok','tf','tags','diff'];
  DEMO.forEach((D,i)=>{
    const olds=db.decks.filter(d=>d.name===D.name||D.aliases.includes(d.name));
    let deck=olds[0];
    if(!deck){deck={id:uid(),fields:{...DEFAULT_FIELDS,src:true},created:now,lastStudied:0};db.decks.push(deck);}
    Object.assign(deck,{name:D.name,subject:D.subject,chapter:D.chapter,theme:D.theme,level:D.level,lang:D.lang,color:D.color,updated:now});
    D.cards.forEach((c,j)=>{
      const fresh=makeCard(deck.id,{...c,src:SRC_NET},j,now);
      const ex=byKey.get(k(fresh));
      if(ex){C.forEach(f=>ex[f]=Array.isArray(fresh[f])?[...fresh[f]]:fresh[f]);ex.src=SRC_NET;ex.deckId=deck.id;ex.pos=j;ex.updated=now;}
      else db.cards.push(fresh);
    });
    olds.slice(1).forEach(o=>{
      db.cards.filter(c=>c.deckId===o.id).forEach(c=>{c.deckId=deck.id;c.pos=1e4+c.pos;});
      db.history.forEach(h=>{if(h.deck===o.id)h.deck=deck.id;});
      db.sessions.forEach(s=>{if(s.deck===o.id)s.deck=deck.id;});
      db.decks=db.decks.filter(d=>d!==o);
    });
  });
  db.contentV=CONTENT_V;return true;
}

let saveT=0;

/* ---------- requêtes ---------- */
const deckById=id=>DB.decks.find(d=>d.id===id);
const cardById=id=>DB.cards.find(c=>c.id===id);
const deckCards=id=>DB.cards.filter(c=>c.deckId===id).sort((a,b)=>a.pos-b.pos);
function deckProgress(id){const cs=deckCards(id);if(!cs.length)return 0;return Math.round(cs.reduce((t,c)=>t+box(c),0)/(cs.length*5)*100);}
function progressOf(cs){if(!cs.length)return 0;return Math.round(cs.reduce((t,c)=>t+box(c),0)/(cs.length*5)*100);}
function countBy(cs){const now=Date.now(),o={new:0,learning:0,due:0,mastered:0};cs.forEach(c=>o[status(c,now)]++);return o;}
function touchDeck(id){const d=deckById(id);if(d)d.updated=Date.now();}
function allTags(){const m=new Map();DB.cards.forEach(c=>c.tags.forEach(t=>m.set(t,(m.get(t)||0)+1)));return [...m.entries()].sort((a,b)=>b[1]-a[1]);}
function streak(){
  const days=new Set(DB.history.map(h=>startOfDay(h.t)));
  let d=startOfDay(Date.now());if(!days.has(d))d-=DAY;
  let n=0;while(days.has(d)){n++;d=startOfDay(d-DAY/2);}
  return n;
}
function dueToday(cs=DB.cards){const now=Date.now();return cs.filter(c=>c.srs.reps&&c.srs.due<=now);}

/* ---------- toasts ---------- */
function toast(msg,type='ok',action){
  const el=document.createElement('div');
  el.className='toast '+type;
  el.innerHTML=`<span class="tic">${ic(type==='err'?'x':type==='info'?'info':'check',13)}</span><span>${esc(msg)}</span>${action?`<button>${esc(action.label)}</button>`:''}`;
  if(action) el.querySelector('button').onclick=()=>{action.fn();dismiss();};
  $('#toasts').appendChild(el);
  let gone=false;
  function dismiss(){if(gone)return;gone=true;el.classList.add('out');setTimeout(()=>el.remove(),220);}
  setTimeout(dismiss,action?6500:3600);
}

let MODAL=null;
function openModal({title,body,foot='',size='',handlers={},onClose}){
  closeModal(true);
  const bg=document.createElement('div');
  bg.className='modal-bg';
  bg.innerHTML=`<div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-h"><h3>${esc(title)}</h3><button class="icon-btn" data-act="m:close" aria-label="Fermer">${ic('x')}</button></div>
    <div class="modal-b" id="modalBody">${body}</div>
    ${foot?`<div class="modal-f" id="modalFoot">${foot}</div>`:''}
  </div>`;
  bg.addEventListener('mousedown',e=>{if(e.target===bg)closeModal();});
  $('#modals').appendChild(bg);
  MODAL={el:bg,handlers:{close:()=>closeModal(),...handlers},onClose,prevFocus:document.activeElement};
  setTimeout(()=>{const f=bg.querySelector('[autofocus],input:not([type=file]),textarea,select,.btn-primary');f&&f.focus();},30);
  return bg;
}
function closeModal(silent){
  if(!MODAL)return;
  const m=MODAL;MODAL=null;m.el.remove();
  if(!silent&&m.onClose)m.onClose();
  if(m.prevFocus&&m.prevFocus.focus&&document.contains(m.prevFocus))m.prevFocus.focus();
}
function confirmBox({title,text,ok='Supprimer',danger=true,onOk}){
  openModal({title,size:'sm',body:`<p style="color:var(--fg-2)">${text}</p>`,
    foot:`<button class="btn" data-act="m:close">Annuler</button><button class="btn ${danger?'btn-danger':'btn-primary'}" data-act="m:ok" autofocus>${esc(ok)}</button>`,
    handlers:{ok:()=>{closeModal(true);onOk();}}});
}

document.addEventListener('click',e=>{

['input','change'].forEach(type=>document.addEventListener(type,e=>{

/* ---------- recherche globale ---------- */
let searchSel=0;
IN.gsearch=el=>{UI.searchQ=el.value;searchSel=0;renderSearch();};
function searchResults(q){
  const n=norm(q.trim());if(!n)return {decks:[],cards:[]};
  const decks=DB.decks.filter(d=>norm(d.name+' '+d.subject+' '+d.chapter+' '+d.theme).includes(n)).slice(0,4);
  const cards=DB.cards.filter(c=>norm([c.term,c.q,c.a,c.opts.join(' '),c.tags.join(' ')].join(' ')).includes(n)).slice(0,7);
  return {decks,cards};
}
function renderSearch(){
  const p=$('#searchPop');const q=UI.searchQ.trim();
  if(!q){p.hidden=true;return;}
  const {decks,cards}=searchResults(q);
  const items=[...decks.map(d=>({k:'deck',id:d.id})),...cards.map(c=>({k:'card',id:c.id}))];
  searchSel=clamp(searchSel,0,Math.max(0,items.length-1));
  let i=0;
  p.innerHTML=!items.length?`<div class="empty" style="padding:18px">${ic('search',22)}<p>Aucun résultat pour « ${esc(q)} ».</p></div>`:
    (decks.length?`<h5>Decks</h5>`+decks.map(d=>`<button class="sr-item ${i++===searchSel?'on':''}" data-act="search-go" data-k="deck" data-id="${d.id}"><span class="monogram" style="--dc:${d.color};width:30px;height:30px;font-size:.78rem">${initials(d.name)}</span><div><b>${hl(d.name,q)}</b><small>${esc(d.subject)} · ${plural(deckCards(d.id).length,'carte')}</small></div></button>`).join(''):'')+
    (cards.length?`<h5>Cartes</h5>`+cards.map(c=>`<button class="sr-item ${i++===searchSel?'on':''}" data-act="search-go" data-k="card" data-id="${c.id}"><span class="badge outline">${TYPES[c.type].short}</span><div><b>${hl(frontText(c),q)}</b><small>${esc((deckById(c.deckId)||{}).name||'')} · ${hl(answerText(c),q)}</small></div></button>`).join(''):'');
  p.hidden=false;
}
document.addEventListener('keydown',e=>{
  if(e.target.id!=='gsearch')return;
  const btns=$$('#searchPop .sr-item');
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();searchSel=clamp(searchSel+(e.key==='ArrowDown'?1:-1),0,btns.length-1);renderSearch();}
  if(e.key==='Enter'&&btns[searchSel]){e.preventDefault();ACT['search-go'](btns[searchSel]);}
});
document.addEventListener('focusin',e=>{if(e.target.id==='gsearch'&&UI.searchQ)renderSearch();});
ACT['search-go']=el=>{
  $('#searchPop').hidden=true;$('#gsearch').value='';UI.searchQ='';$('#gsearch').blur();
  if(el.dataset.k==='deck'){openEditor(el.dataset.id);}
  else{const c=cardById(el.dataset.id);if(c)openEditor(c.deckId,c.id);}
};

VIEWS.home=()=>{
  const now=Date.now(),cards=DB.cards,total=cards.length;

  const prog=progressOf(cards);
  const sess=[...DB.sessions].sort((a,b)=>b.end-a.end);
  const last=sess[0];
  const totalMs=DB.history.reduce((t,h)=>t+h.ms,0);
  const weekMs=DB.history.filter(h=>h.t>now-7*DAY).reduce((t,h)=>t+h.ms,0);
  const cur=(last&&deckById(last.deck))||[...DB.decks].sort((a,b)=>b.updated-a.updated)[0];
  const date=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});

      <div class="row" style="margin-top:4px">
        <button class="btn btn-primary btn-lg" data-act="quick-study" ${todo?'':'disabled'}>${ic('play',16)}Commencer à réviser</button>
        <button class="btn btn-lg" data-act="create-deck">${ic('plus',16)}Créer un deck</button>
        <button class="btn btn-lg btn-ghost" data-act="open-import">${ic('upload',16)}Importer</button>
      </div>
    </div>
    ${cur?`<div class="panel resume" style="--dc:${cur.color}">
      <div class="row" style="justify-content:space-between"><span class="eyebrow">Deck en cours</span><span class="badge outline">${esc(cur.level)}</span></div>
      <div class="row" style="flex-wrap:nowrap;gap:12px"><span class="monogram">${esc(initials(cur.name))}</span><div style="min-width:0"><h3>${esc(cur.name)}</h3><p class="muted" style="font-size:.88rem">${esc(cur.subject)} · ${esc(cur.chapter||cur.theme||'')}</p></div></div>
      <div class="deck-prog"><div class="progress"><i style="width:${progressOf(curCards)}%"></i></div><span>${progressOf(curCards)} %</span></div>
      <div class="kv">
        <div><span>Cartes</span><b>${curCards.length}</b></div>
        <div><span>À revoir</span><b>${dueToday(curCards).length}</b></div>
        <div><span>Dernière session</span><b>${curLast?fmtRel(curLast):'Jamais'}</b></div>
        <div><span>Temps d'étude</span><b>${fmtDur(curMs)}</b></div>
      </div>
      <div class="row"><button class="btn btn-primary btn-sm" data-act="study-deck" data-id="${cur.id}">${ic('play',13)}Reprendre</button><button class="btn btn-sm" data-act="edit-deck" data-id="${cur.id}">${ic('edit',14)}Ouvrir</button></div>
    </div>`:`<div class="panel">${emptyState('decks','Aucun deck pour l\'instant','Générez un deck à partir de vos cours ou importez un fichier CSV.',`<button class="btn btn-primary btn-sm" data-act="go" data-view="generator">${ic('spark',14)}Ouvrir le générateur</button>`)}</div>`}
  </section>
  <section class="kpis">
    <div class="panel kpi"><span class="k-l">${ic('decks',15)}Cartes</span><span class="k-v">${total}</span><span class="k-s">dans ${plural(DB.decks.length,'deck')}</span></div>
    <div class="panel kpi"><span class="k-l">${ic('target',15)}Progression</span><span class="k-v">${prog} %</span><div class="progress" style="flex:none"><i style="width:${prog}%"></i></div></div>
    <div class="panel kpi"><span class="k-l">${ic('calendar',15)}Dernière session</span><span class="k-v" style="font-size:1.35rem">${last?fmtRel(last.end):'Aucune'}</span><span class="k-s">${last?`${plural(last.n,'carte')} · ${last.n?Math.round(last.ok/last.n*100):0} % de réussite`:'Lancez votre première révision'}</span></div>
    <div class="panel kpi"><span class="k-l">${ic('clock',15)}Temps d'étude</span><span class="k-v">${fmtDur(totalMs)}</span><span class="k-s">${fmtDur(weekMs)} ces 7 derniers jours</span></div>
  </section>
  <section class="two">
    <div class="panel">
      <div class="panel-h"><div><h2>À réviser aujourd'hui</h2><p>Cartes arrivées à échéance et nouvelles cartes du jour</p></div></div>
      ${decksDue.some(x=>x.due||x.nw)?`<div class="due-list">${decksDue.filter(x=>x.due||x.nw).map(x=>`

  </section>`;

function deckGridHTML(){
  const q=norm(UI.deckQ);
  let ds=DB.decks.filter(d=>(!q||norm(d.name+' '+d.subject+' '+d.chapter+' '+d.theme+' '+d.level).includes(q))&&(!UI.deckSubject||d.subject===UI.deckSubject));
  const k=UI.deckSort;
  ds.sort((a,b)=>k==='name'?a.name.localeCompare(b.name,'fr'):k==='progress'?deckProgress(b.id)-deckProgress(a.id):k==='cards'?deckCards(b.id).length-deckCards(a.id).length:k==='due'?dueToday(deckCards(b.id)).length-dueToday(deckCards(a.id)).length:b.updated-a.updated);
  if(!DB.decks.length) return `<div class="panel">${emptyState('decks','Aucun deck','Commencez par créer un deck, ou laissez le générateur en préparer un à partir de votre cours.',`<button class="btn btn-primary btn-sm" data-act="create-deck">${ic('plus',14)}Créer un deck</button><button class="btn btn-sm" data-act="go" data-view="generator">${ic('spark',14)}Générateur</button>`)}</div>`;
  if(!ds.length) return `<div class="panel">${emptyState('search','Aucun deck ne correspond','Essayez un autre mot-clé ou retirez le filtre de matière.',`<button class="btn btn-sm" data-act="deck-reset">Réinitialiser les filtres</button>`)}</div>`;
  return `<p class="muted" style="font-size:.88rem;margin-bottom:10px">${plural(ds.length,'deck')} · ${ds.reduce((t,d)=>t+deckCards(d.id).length,0)} cartes</p><div class="deck-grid">${ds.map(deckCardHTML).join('')}</div>`;
}

ACT['study-deck']=el=>startSession({deck:el.dataset.id,mode:'due'},true);
ACT['edit-deck']=el=>openEditor(el.dataset.id);
ACT['dup-deck']=el=>{
  const d=deckById(el.dataset.id);if(!d)return;
  const now=Date.now();
  const nd={...d,id:uid(),name:d.name+' (copie)',fields:{...d.fields},created:now,updated:now,lastStudied:0};
  DB.decks.push(nd);
  deckCards(d.id).forEach(c=>DB.cards.push({...c,id:uid(),deckId:nd.id,tags:[...c.tags],opts:[...c.opts],srs:newSrs(),created:now,updated:now}));
  persist();render();toast(`« ${nd.name} » créé avec ${plural(deckCards(nd.id).length,'carte')}`,'ok',{label:'Ouvrir',fn:()=>openEditor(nd.id)});
};
ACT['del-deck']=el=>{
  const d=deckById(el.dataset.id);if(!d)return;
  const n=deckCards(d.id).length;
  confirmBox({title:'Supprimer ce deck ?',text:`« <b>${esc(d.name)}</b> » et ses ${plural(n,'carte')} seront supprimés, ainsi que leur progression. L'historique des statistiques est conservé.`,ok:'Supprimer le deck',onOk:()=>{
    const snap={deck:d,cards:DB.cards.filter(c=>c.deckId===d.id)};
    DB.decks=DB.decks.filter(x=>x.id!==d.id);DB.cards=DB.cards.filter(c=>c.deckId!==d.id);
    if(UI.editorDeck===d.id){UI.editorDeck=null;UI.editorCard=null;}
    persist();render();
    toast(`Deck « ${d.name} » supprimé`,'ok',{label:'Annuler',fn:()=>{DB.decks.push(snap.deck);DB.cards.push(...snap.cards);persist();render();toast('Suppression annulée','info');}});
  }});
};

  <datalist id="subjectList">${[...new Set([...SUBJECTS,...DB.decks.map(x=>x.subject)])].map(s=>`<option value="${esc(s)}">`).join('')}</datalist>`;
}
function readDeckForm(prefix='df'){

ACT['create-deck']=()=>{

        setTimeout(()=>{const q=$('#ef-q');q&&q.focus();},60);}}});

/* =========================================================
   Éditeur de cartes + vue « Toutes les cartes »

let edFilter='';
function openEditor(deckId,cardId){
  UI.editorDeck=deckId;UI.editorMode='deck';edFilter='';
  const cs=deckCards(deckId);
  UI.editorCard=cardId||(cs[0]&&cs[0].id)||null;
  go('editor');
  if(cardId) setTimeout(()=>{const li=$(`.ed-item[data-id="${cardId}"]`);li&&li.scrollIntoView({block:'nearest'});},30);
}
function fieldsOf(c){if(c._fields)return c._fields;const d=deckById(c.deckId);return d?d.fields:DEFAULT_FIELDS;}

/* ---------- rendu de la face d'une carte (révision + aperçu) ---------- */
function clozeHTML(q,revealed){return esc(q).replace(/\{\{(.+?)\}\}/g,(m,a)=>revealed?`<span class="blank filled">${a}</span>`:`<span class="blank" aria-label="mot masqué"></span>`);}
function frontHTML(c,{revealed=false,pick=null,interactive=false,hint=false}={}){
  const F=fieldsOf(c);let h='';
  if(F.image&&c.image) h+=`<img class="card-img" src="${esc(c.image)}" alt="Illustration de la carte">`;
  if(F.term&&c.term) h+=`<div class="term">${esc(c.term)}</div>`;
  if(c.type==='cloze') h+=`<div class="q">${clozeHTML(c.q,revealed)}</div>`;
  else if(c.q&&(F.q||c.type==='tf'||c.type==='mcq'||!(F.term&&c.term))) h+=`<div class="q">${esc(c.q)}</div>`;
  if(!(F.term&&c.term)&&!c.q) h+=`<div class="q muted">Recto vide — complétez la carte dans l'éditeur.</div>`;
  if(c.type==='mcq') h+=`<div class="mcq">${c.opts.map((o,i)=>{let cls='';if(revealed){if(i===c.ok)cls='right';else if(i===pick)cls='wrong';}
    return `<button class="${cls}" ${interactive&&!revealed?`data-act="s-pick" data-i="${i}"`:'disabled'}><kbd>${'ABCDEF'[i]}</kbd><span style="flex:1">${esc(o)}</span>${revealed&&i===c.ok?ic('check',16):''}</button>`;}).join('')}</div>`;
  if(c.type==='tf'&&interactive&&!revealed) h+=`<div class="tf"><button class="btn btn-lg" data-act="s-tf" data-v="1">Vrai <kbd>V</kbd></button><button class="btn btn-lg" data-act="s-tf" data-v="0">Faux <kbd>F</kbd></button></div>`;
  if(F.hint&&c.hint&&!revealed){
    if(hint) h+=`<div class="hint-box">${ic('bulb',16)}<span>${esc(c.hint)}</span></div>`;
    else if(interactive) h+=`<button class="btn btn-sm btn-ghost" style="align-self:flex-start" data-act="s-hint">${ic('bulb',15)}Afficher l'indice <kbd>H</kbd></button>`;
    else h+=`<div class="hint-box">${ic('bulb',16)}<span>Indice : ${esc(c.hint)}</span></div>`;
  }
  return h;
}
function backHTML(c,{pick=null}={}){
  const F=fieldsOf(c);let h='';
  if((c.type==='mcq'||c.type==='tf')&&pick!==null){
    const right=c.type==='mcq'?pick===c.ok:(pick===1)===!!c.tf;
    h+=`<div class="row" style="gap:8px">${right?`<span class="badge good">${ic('check',13)}Bonne réponse</span>`:`<span class="badge bad">${ic('x',13)}Mauvaise réponse</span>`}</div>`;
  }
  const ans=c.type==='tf'?(c.tf?'Vrai':'Faux'):c.type==='mcq'?(c.opts[c.ok]||''):c.type==='cloze'?clozeParts(c.q).join(' · '):c.a;
  if(c.type!=='cloze') h+=`<div class="ans">${esc(ans||'—')}</div>`;
  else h+=`<div class="row" style="gap:8px"><span class="badge good">${ic('check',13)}Réponse</span><span class="ans" style="font-size:1.05rem">${esc(ans)}</span></div>`;
  const rows=[];
  if(c.a&&['tf','mcq','cloze'].includes(c.type)&&F.a) rows.push(['','Complément',c.a]);
  [['expl','Explication'],['ex','Exemple'],['imp','Point important'],['err','Erreur fréquente'],['src','Source']].forEach(([f,l])=>{if(F[f]&&c[f])rows.push([f,l,c[f]]);});
  h+=rows.map(([f,l,v])=>`<div class="fb-field ${f}"><span>${l}</span><div>${esc(v)}</div></div>`).join('');
  return h;
}

VIEWS.editor=()=>{

    </div>
    <div class="panel" id="edForm">${c?edFormHTML(c,d):emptyState('notes','Ce deck est vide','Ajoutez une première carte, générez-en à partir d\'un texte ou importez un fichier.',`<button class="btn btn-primary btn-sm" data-act="ed-add">${ic('plus',14)}Ajouter une carte</button><button class="btn btn-sm" data-act="go" data-view="generator">${ic('spark',14)}Générateur</button>`)}</div>

function edListHTML(cs){
  const q=norm(edFilter);
  const list=cs.map((c,i)=>({c,i})).filter(({c})=>!q||norm(frontText(c)+' '+answerText(c)+' '+c.tags.join(' ')).includes(q));
  if(!list.length) return `<li class="empty" style="padding:24px 10px"><p>${cs.length?'Aucune carte ne correspond à ce filtre.':'Aucune carte.'}</p></li>`;
  return list.map(({c,i})=>`<li class="ed-item ${c.id===UI.editorCard?'sel':''}" draggable="${q?'false':'true'}" data-id="${c.id}" data-act="ed-select">
    <span class="grip" title="Glisser pour réorganiser">${ic('grip',14)}</span><span class="n">${i+1}</span>
    <div class="ed-txt"><b>${esc(frontText(c))}</b><small>${esc(answerText(c)||'Sans réponse')}</small></div>
    <div class="ed-meta"><span class="row" style="gap:4px;flex-wrap:nowrap">${c.star?`<span style="color:var(--warn)">${ic('star',13,'fill')}</span>`:''}${c.draft?'<span class="badge warn" style="font-size:.64rem;padding:0 6px">À compléter</span>':''}<span class="badge outline" style="font-size:.66rem;padding:0 6px">${TYPES[c.type].short}</span></span><span class="row" style="gap:6px;flex-wrap:nowrap">${diffDots(c.diff)}<span class="dot st-${status(c)}" title="${STATUS_LABEL[status(c)]}"></span></span></div>
    ${q?'':`<div class="ed-move"><button class="icon-btn" data-act="ed-move" data-dir="-1" data-id="${c.id}" aria-label="Monter" ${i===0?'disabled':''}>${ic('up')}</button><button class="icon-btn" data-act="ed-move" data-dir="1" data-id="${c.id}" aria-label="Descendre" ${i===cs.length-1?'disabled':''}>${ic('down')}</button></div>`}
  </li>`).join('');
}
function fieldInput(c,f,label,{area=true,ph='',help='',rows=2}={}){
  return `<div class="field"><label for="ef-${f}">${label}</label>${area?`<textarea class="ta" id="ef-${f}" rows="${rows}" style="min-height:0" data-in="ef" data-f="${f}" placeholder="${esc(ph)}">${esc(c[f])}</textarea>`:`<input class="inp" id="ef-${f}" data-in="ef" data-f="${f}" value="${esc(c[f])}" placeholder="${esc(ph)}">`}${help?`<small id="ef-${f}-help">${help}</small>`:''}</div>`;

function clozeHelp(q){const n=clozeParts(q).length;return n?`${plural(n,'trou')} détecté${n>1?'s':''} : ${clozeParts(q).map(esc).join(', ')}`:'<span style="color:var(--bad)">Aucun trou : entourez les mots à masquer avec {{ }}, par exemple {{mitochondrie}}.</span>';}
function edFormHTML(c,d){
  const F=d.fields,t=c.type,s=c.srs,st=status(c);
  const hidden=[...FIELDS.front,...FIELDS.back].filter(f=>!F[f[0]]).map(f=>f[1]);

    <div class="row" style="justify-content:space-between">
      <div class="row" style="gap:8px"><span class="badge acc">Carte ${deckCards(d.id).findIndex(x=>x.id===c.id)+1} / ${deckCards(d.id).length}</span>${statusPill(c)}</div>
