    <div class="ed-sec"><h4>Recto</h4>
      ${F.term?fieldInput(c,'term','Terme',{area:false,ph:t==='term'?'Ex. : Photosynthèse':'Facultatif — mot mis en avant'}):''}
      ${showQ?fieldInput(c,'q',qLabel,{ph:t==='cloze'?'La {{mitochondrie}} produit l\'ATP.':t==='tf'?'Ex. : Les procaryotes ont un noyau.':'Ex. : Quel organite produit l\'ATP ?',help:t==='cloze'?clozeHelp(c.q):'',rows:t==='cloze'?3:2}):''}
      ${t==='mcq'?`<div class="field"><span class="lbl">Propositions — cochez la bonne réponse</span><div class="stack" style="gap:8px">${c.opts.map((o,i)=>`<div class="opt-row"><button class="radio ${i===c.ok?'on':''}" data-act="ed-ok" data-i="${i}" aria-label="Bonne réponse ${i+1}">${i===c.ok?ic('check',12):''}</button><input class="inp" data-in="ef-opt" data-i="${i}" value="${esc(o)}" placeholder="Proposition ${'ABCDEF'[i]}"><button class="icon-btn danger" data-act="ed-opt-rm" data-i="${i}" ${c.opts.length<=2?'disabled':''} aria-label="Retirer">${ic('x',15)}</button></div>`).join('')}</div>${c.opts.length<6?`<button class="btn btn-sm btn-ghost" style="align-self:flex-start" data-act="ed-opt-add">${ic('plus',14)}Ajouter une proposition</button>`:''}</div>`:''}
      ${t==='tf'?`<div class="field"><span class="lbl">Réponse attendue</span><div class="seg"><button class="${c.tf?'on':''}" data-act="ed-tf" data-v="1">Vrai</button><button class="${!c.tf?'on':''}" data-act="ed-tf" data-v="0">Faux</button></div></div>`:''}
      ${F.hint?fieldInput(c,'hint','Indice',{area:false,ph:'Facultatif — ex. : commence par « mito »'}):''}
      ${F.image?`<div class="field"><span class="lbl">Image</span>${c.image?`<div class="img-prev"><img src="${esc(c.image)}" alt="Image de la carte"><button class="icon-btn" data-act="ed-img-rm" aria-label="Retirer l'image">${ic('x',15)}</button></div>`:''}
        <div class="row"><label class="btn btn-sm" style="cursor:pointer">${ic('image',15)}${c.image?'Remplacer':'Choisir une image'}<input type="file" accept="image/*" hidden data-in="ef-img"></label><span class="muted" style="font-size:.8rem">ou</span><input class="inp" style="flex:1;min-width:160px" data-in="ef" data-f="image" value="${c.image&&c.image.startsWith('data:')?'':esc(c.image)}" placeholder="Coller l'URL d'une image"></div></div>`:''}
    </div>
    <div class="ed-sec"><h4>Verso</h4>

    </div>

        <datalist id="tagList">${allTags().map(([t])=>`<option value="${esc(t)}">`).join('')}</datalist></div>
      <div class="field"><span class="lbl">Difficulté</span><div class="diff-pick">${[1,2,3,4,5].map(i=>`<button class="${c.diff===i?'on':''}" data-act="ed-diff" data-v="${i}">${DIFF[i]}</button>`).join('')}</div></div>
    </div>
    <div class="ed-sec"><h4>Progression</h4>
      <div class="srs-box">
        <div><span>Boîte</span><b>${box(c)} / 5</b><div class="leitner">${[1,2,3,4,5].map(i=>`<i class="${i<=box(c)?'on':''}"></i>`).join('')}</div></div>

      <button class="btn btn-ghost" data-act="ed-nav" data-dir="-1">${ic('arrowL',16)}Précédente</button>
      <button class="btn btn-ghost" data-act="ed-nav" data-dir="1">Suivante${ic('arrowR',16)}</button>
    </div>
  </div>`;
}
function curCard(){return cardById(UI.editorCard);}
function cardChanged(c,listToo=true){
  c.updated=Date.now();c.draft=c.draft&&!(c.a&&c.a!=='À compléter');touchDeck(c.deckId);persist();
  if(listToo){const li=$(`.ed-item[data-id="${c.id}"]`);if(li){li.querySelector('.ed-txt b').textContent=frontText(c);li.querySelector('.ed-txt small').textContent=answerText(c)||'Sans réponse';}}
}
function refreshEditor(){const d=deckById(UI.editorDeck);if(!d)return render();const c=curCard();$('#edList').innerHTML=edListHTML(deckCards(d.id));$('#edForm').innerHTML=c?edFormHTML(c,d):'';renderSidebar();}

IN['ed-deck']=el=>openEditor(el.value);
IN['ed-filter']=el=>{edFilter=el.value;$('#edList').innerHTML=edListHTML(deckCards(UI.editorDeck));};
ACT['ed-mode']=el=>{UI.editorMode=el.dataset.m;render();};
ACT['ed-select']=el=>{
  if(UI.editorCard===el.dataset.id)return;
  UI.editorCard=el.dataset.id;
  $$('.ed-item').forEach(li=>li.classList.toggle('sel',li.dataset.id===UI.editorCard));
  const d=deckById(UI.editorDeck);$('#edForm').innerHTML=edFormHTML(curCard(),d);
  if(window.innerWidth<980)$('#edForm').scrollIntoView({behavior:S.anim?'smooth':'auto',block:'start'});
};
ACT['ed-nav']=el=>{const cs=deckCards(UI.editorDeck);const i=cs.findIndex(c=>c.id===UI.editorCard);const n=cs[i+Number(el.dataset.dir)];if(n){UI.editorCard=n.id;refreshEditor();const li=$(`.ed-item[data-id="${n.id}"]`);li&&li.scrollIntoView({block:'nearest'});}};
IN.ef=(el)=>{
  const c=curCard();if(!c)return;
  c[el.dataset.f]=el.value;
  if(el.dataset.f==='q'&&c.type==='cloze'){const h=$('#ef-q-help');if(h)h.innerHTML=clozeHelp(c.q);}
  cardChanged(c);
};
IN['ef-type']=el=>{
  const c=curCard();const t=el.value;
  if(t==='mcq'&&c.opts.length<2){c.opts=[c.a||'','','',''];c.ok=0;}
  if(t==='cloze'&&!/\{\{/.test(c.q)&&c.a&&c.q.includes(c.a)) c.q=c.q.replace(c.a,`{{${c.a}}}`);
  if(t==='term'&&!c.term&&c.q&&wc(c.q)<=5){c.term=c.q;c.q='';}
  c.type=t;cardChanged(c,false);refreshEditor();
};
IN['ef-opt']=el=>{const c=curCard();c.opts[Number(el.dataset.i)]=el.value;cardChanged(c);};
ACT['ed-ok']=el=>{const c=curCard();c.ok=Number(el.dataset.i);cardChanged(c);refreshEditor();};
ACT['ed-opt-add']=()=>{const c=curCard();c.opts.push('');cardChanged(c);refreshEditor();const ins=$$('[data-in="ef-opt"]');ins[ins.length-1]&&ins[ins.length-1].focus();};

function fileToImage(file,cb){
  const fr=new FileReader();
  fr.onload=()=>{const img=new Image();img.onload=()=>{const max=900;const k=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(img,0,0,cv.width,cv.height);try{cb(cv.toDataURL('image/jpeg',.82));}catch(e){cb(null);}};img.onerror=()=>cb(null);img.src=fr.result;};

   Révision, statistiques, paramètres
   ========================================================= */
const MODES={due:['À réviser','Cartes à échéance + nouvelles du jour'],all:['Toutes','Tout le deck, sans tenir compte des échéances'],new:['Nouvelles','Uniquement les cartes jamais étudiées'],star:['Importantes','Cartes marquées d\'une étoile'],hard:['Difficiles','Difficulté élevée ou erreurs récentes']};
function selectCards(deck,mode){
  const now=Date.now();
  let cs=deck==='all'?DB.cards.slice():deckCards(deck);
  if(Array.isArray(deck)) cs=deck.map(cardById).filter(Boolean);
  switch(mode){
    case 'due':{const due=cs.filter(c=>c.srs.reps&&c.srs.due<=now);const nw=cs.filter(c=>!c.srs.reps).slice(0,S.newLimit);return [...due,...nw];}
    case 'new':return cs.filter(c=>!c.srs.reps);
    case 'star':return cs.filter(c=>c.star);
    case 'hard':return cs.filter(c=>c.diff>=4||c.srs.lapses>0||c.srs.lastGrade===0||c.srs.lastGrade===1);
    default:return cs;
  }
}
function orderCards(cs,order){
  const now=Date.now();
  if(order==='random') return shuffle(cs.slice());
  if(order==='progressive') return cs.slice().sort((a,b)=>a.diff-b.diff||box(b)-box(a)||a.pos-b.pos);
  if(order==='hardest') return cs.slice().sort((a,b)=>b.diff-a.diff||b.srs.lapses-a.srs.lapses||box(a)-box(b));
  const rank=c=>{const s=status(c,now);return s==='due'?(c.srs.lastGrade===0?0:1):s==='new'?2:3;};
  return cs.slice().sort((a,b)=>rank(a)-rank(b)||(a.srs.due-b.srs.due)||a.pos-b.pos);
}
function startSession(opts,fromDeck){
  const order=opts.order||UI.setup.order||S.order;
  let cs=selectCards(opts.ids||opts.deck,opts.mode);
  if(!cs.length&&fromDeck&&opts.mode==='due'){
    UI.setup.deck=opts.deck;UI.setup.mode='all';
    toast('Rien à réviser dans ce deck pour l\'instant : choisissez une session libre.','info');
    UI.session=null;go('study');return;
  }
  if(!cs.length){toast('Aucune carte ne correspond à cette sélection','err');return;}
  cs=orderCards(cs,order);
  const limit=opts.limit||(fromDeck||opts.ids?0:UI.setup.limit);
  if(limit&&cs.length>limit) cs=cs.slice(0,limit);
  const label=opts.ids?'Cartes à retravailler':opts.deck==='all'?'Tous les decks':(deckById(opts.deck)||{}).name;
  UI.session={queue:cs.map(c=>c.id),i:0,revealed:false,pick:null,hint:false,results:[],start:Date.now(),cardStart:Date.now(),requeued:{},label,deck:opts.ids?'mix':opts.deck,mode:opts.mode,ended:false,anim:0};
  sound('flip');go('study');
}

function grade(g){

  const now=Date.now(),ms=Math.min(now-s.cardStart,5*MIN);
  c.srs=schedule(c.srs,g,now);
  DB.history.push({t:now,card:c.id,deck:c.deckId,g,ms,ivl:c.srs.ivl});
  s.results.push({id:c.id,g,ms});
  const d=deckById(c.deckId);if(d)d.lastStudied=now;
  if(g===0&&(s.requeued[c.id]||0)<2){s.requeued[c.id]=(s.requeued[c.id]||0)+1;s.queue.splice(Math.min(s.queue.length,s.i+4),0,c.id);}
  s.i++;s.revealed=false;s.pick=null;s.hint=false;s.cardStart=Date.now();

function studyKey(e){
  const s=UI.session;if(!s||s.ended)return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const c=cardById(s.queue[s.i]);if(!c)return;
  const k=e.key.toLowerCase();
  if(!s.revealed){
    if(c.type==='mcq'&&'abcdef'.includes(k)&&k.length===1){const i='abcdef'.indexOf(k);if(i<c.opts.length){e.preventDefault();ACT['s-pick']({dataset:{i}});}return;}
    if(c.type==='tf'&&(k==='v'||k==='f')){e.preventDefault();ACT['s-tf']({dataset:{v:k==='v'?'1':'0'}});return;}
    if(k==='h'){ACT['s-hint']();return;}
    if(e.key===' '||e.key==='Enter'){e.preventDefault();ACT['s-reveal']();}
  }else{
    if(['1','2','3','4'].includes(e.key)){e.preventDefault();grade(Number(e.key)-1);}
    else if(e.key===' '||e.key==='Enter'){e.preventDefault();}
  }
}

function sound(name,force){

function barsHTML(cols,{h=190,colors,max,yFmt=v=>v,every=1}={}){
  const m=Math.max(1,max||Math.max(...cols.map(c=>c.v.reduce((a,b)=>a+b,0))));
  const step=niceStep(m);const top=Math.ceil(m/step)*step;
  const ticks=[];for(let v=0;v<=top;v+=step)ticks.push(v);
  return `<div class="bars" style="--h:${h}px">
    <div class="bars-y">${ticks.map(v=>`<span style="bottom:${v/top*100}%">${yFmt(v)}</span>`).join('')}</div>
    <div class="bars-plot" style="height:100%">
      <div style="position:absolute;inset:0 0 20px 0;pointer-events:none">${ticks.map(v=>`<div class="grid-l" style="bottom:${v/top*100}%;top:auto"></div>`).join('')}</div>
      ${cols.map((c,i)=>`<div class="bcol"><div class="bstack">${c.v.map((v,j)=>v?`<i style="height:${v/top*100}%;background:${colors[j]}"></i>`:'').join('')}</div><span class="bx">${i%every===0||i===cols.length-1?esc(c.l):''}</span><span class="btip">${c.tip}</span></div>`).join('')}
    </div></div>`;
}
function niceStep(m){const raw=m/4;const p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;return Math.max(1,(n<=1?1:n<=2?2:n<=5?5:10)*p);}
function lineHTML(points,{fmt=v=>v,labels}){
  const max=Math.max(1,...points);const step=niceStep(max);const top=Math.ceil(max/step)*step;
  const ticks=[];for(let v=0;v<=top;v+=step)ticks.push(v);
  const n=points.length;const X=i=>n>1?i/(n-1)*100:50,Y=v=>100-v/top*100;
  const path=points.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(2)} ${Y(v).toFixed(2)}`).join(' ');
  const area=`${path} L100 100 L0 100 Z`;
  const last=points[n-1];
  return `<div class="line-chart">
    <div class="bars-y">${ticks.map(v=>`<span style="bottom:${v/top*100}%">${fmt(v)}</span>`).join('')}</div>
    <div><div class="line-plot">
      ${ticks.map(v=>`<div class="grid-l" style="top:${Y(v)}%"></div>`).join('')}
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="${area}" fill="var(--accent)" fill-opacity=".12" stroke="none"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>
      <span class="end-dot" style="left:${X(n-1)}%;top:${Y(last)}%"></span><span class="end-lbl" style="left:${X(n-1)}%;top:${Y(last)}%">${fmt(last)}</span>
    </div><div class="line-x">${labels.map(l=>`<span>${esc(l)}</span>`).join('')}</div></div>
  </div>`;
}

Une centrale hydraulique convertit l'énergie potentielle de l'eau en énergie électrique. Le rendement est le rapport entre l'énergie utile et l'énergie reçue. Il est toujours inférieur à 1 car une partie de l'énergie est dissipée sous forme de chaleur. Une ampoule LED a un rendement d'environ 40 %, contre 5 % pour une ampoule à incandescence.

function sampleCard(g){
  if(g.mode==='manual'){const cs=manualCards(g);return cs[0]||null;}
  const r=generateCards(g,g.seed);
  return r.cards.find(c=>c.expl||c.ex)||r.cards[0]||null;
}
function manualRowsHTML(g){
  return g.manual.map((r,i)=>`<div class="manual-row"><span class="n">${i+1}</span><input class="inp" placeholder="${g.manualType==='term'?'Terme':'Question'}" value="${esc(r.q)}" data-in="g-man" data-i="${i}" data-k="q" aria-label="Question ${i+1}"><input class="inp" placeholder="${g.manualType==='term'?'Définition':'Réponse'}" value="${esc(r.a)}" data-in="g-man" data-i="${i}" data-k="a" aria-label="Réponse ${i+1}"><button class="icon-btn danger" data-act="g-man-rm" data-i="${i}" aria-label="Supprimer la ligne" ${g.manual.length<=1?'disabled':''}>${ic('x',15)}</button></div>`).join('');
}
function genAsideHTML(g){
  const an=getAnalysis(g),C=an.counts;
  const empty=g.text.trim().length<60;
  let est='';
  if(empty){
    const sh=normShares(g.shares);
    est=`<div class="est-big"><b>${g.count}</b><span class="muted">cartes demandées</span></div><div class="split3">${['mem','comp','trap'].map(k=>`<i style="width:${sh[k]}%;background:${STYLE_COLOR[k]}"></i>`).join('')}</div><div class="legend">${['mem','comp','trap'].map(k=>`<span><i style="background:${STYLE_COLOR[k]}"></i>${STYLE_NAME[k]} ${Math.round(sh[k]*g.count/100)}</span>`).join('')}</div><p class="muted" style="font-size:.84rem">Ajoutez du contenu pour une estimation précise.</p>`;
  }else{
    const r=generateCards(g,g.seed);const n=r.cards.length;
    const bySt={mem:0,comp:0,trap:0};const byT={};let dsum=0;
    r.cards.forEach(c=>{bySt[c._style]++;byT[c.type]=(byT[c.type]||0)+1;dsum+=c.diff;});
    const avg=n?Math.round(dsum/n*10)/10:0;
    est=`<div class="est-big"><b>${n}</b><span class="muted">/ ${g.count} cartes</span></div>
      ${n<g.count?`<div class="notice warn" style="font-size:.84rem">${ic('alert',15)}<div>Le contenu permet ${plural(n,'carte')} distincte${n>1?'s':''} avec ces types. Ajoutez du texte ou autorisez plus de types.</div></div>`:''}
      ${n?`<div class="split3">${['mem','comp','trap'].map(k=>bySt[k]?`<i style="width:${bySt[k]/n*100}%;background:${STYLE_COLOR[k]}"></i>`:'').join('')}</div>
      <div class="legend">${['mem','comp','trap'].map(k=>`<span><i style="background:${STYLE_COLOR[k]}"></i>${STYLE_NAME[k]} ${bySt[k]}</span>`).join('')}</div>
      <div class="hbars">${Object.keys(TYPES).filter(t=>byT[t]).map(t=>`<div class="hbar"><span>${TYPES[t].short}</span><div class="track"><i style="width:${byT[t]/n*100}%"></i></div><span>${byT[t]}</span></div>`).join('')}</div>
      <div class="row" style="justify-content:space-between;font-size:.86rem;color:var(--fg-2)"><span>Difficulté moyenne <b>${fmtNum(avg)}</b> ${diffDots(Math.round(avg))}</span><span>≈ ${Math.max(1,Math.round(n*15/60))} min</span></div>`:''}`;
  }
  return `<div class="panel"><div class="panel-h" style="margin-bottom:10px"><h3>Analyse du contenu</h3>${empty?'':`<span class="badge good">${ic('check',12)}Analysé</span>`}</div>
      <div class="an-grid">
        <div><b>${C.defs}</b><span>Notions définies</span></div><div><b>${C.dates}</b><span>Dates et chiffres</span></div>
        <div><b>${C.causes}</b><span>Relations de cause</span></div><div><b>${C.traps}</b><span>Mises en garde</span></div>
        <div><b>${C.examples}</b><span>Exemples</span></div><div><b>${C.sections}</b><span>Sections</span></div>
      </div>
      ${an.keywords.length&&!empty?`<div class="stack" style="gap:6px;margin-top:12px"><span class="lbl">Notions repérées</span><div class="chips">${an.keywords.slice(0,10).map(k=>`<span class="tag plain">${esc(k)}</span>`).join('')}</div></div>`:''}
    </div>
    <div class="panel stack" style="gap:12px"><h3 style="font-size:1.08rem">Estimation</h3>${est}</div>`;
}

function parseCSV(text,delim){
  text=String(text).replace(/^\uFEFF/,'');
  if(delim==='auto'){
    const sample=text.split('\n').slice(0,6).join('\n');
    const c=[[';',0],[',',0],['\t',0],['|',0]].map(([d])=>[d,sample.split(d).length-1]);
    c.sort((a,b)=>b[1]-a[1]);delim=c[0][1]?c[0][0]:',';
  }
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=ch;continue;}
    if(ch==='"'&&f==='')q=true;
    else if(ch===delim){row.push(f);f='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}
    else f+=ch;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return {rows:rows.filter(r=>r.some(c=>c.trim())),delim};
}
function guessTarget(h){
  h=norm(h).trim();
  if(/question|recto|front|^q$|enonce|intitule/.test(h))return 'q';
  if(/^terme|^term|^mot|word|notion|concept|vocab/.test(h))return 'term';
  if(/reponse|answer|verso|back|^r$|^a$|definition|traduction/.test(h))return 'a';
  if(/explic|explan|justif/.test(h))return 'expl';
  if(/exemple|example/.test(h))return 'ex';
  if(/indice|hint|aide/.test(h))return 'hint';
  if(/important|retenir/.test(h))return 'imp';
  if(/erreur|piege|mistake/.test(h))return 'err';
  if(/source|ref/.test(h))return 'src';
  if(/tag|etiquette|label|categorie/.test(h))return 'tags';
  if(/diffic|niveau|level/.test(h))return 'diff';
  if(/^type/.test(h))return 'type';
  return '';
}
function parseDiff(v){const n=parseInt(v,10);if(n>=1&&n<=5)return n;const s=norm(v);if(/tres facile|very easy/.test(s))return 1;if(/facile|easy/.test(s))return 2;if(/moyen|medium|normal/.test(s))return 3;if(/expert/.test(s))return 5;if(/difficile|hard/.test(s))return 4;return 3;}
function parseType(v){const s=norm(v);if(/terme|term|defin/.test(s))return 'term';if(/concept/.test(s))return 'concept';if(/trou|cloze/.test(s))return 'cloze';return 'qa';}
function objToCard(o){
  if(Array.isArray(o)) o={q:o[0],a:o[1]};
  if(!o||typeof o!=='object')return null;
  const K={};Object.keys(o).forEach(k=>K[norm(k).replace(/[^a-z]/g,'')]=o[k]);
  const pick=(...ks)=>{for(const k of ks)if(K[k]!==undefined&&K[k]!==null&&String(K[k]).trim()!=='')return K[k];return '';};
  const c={q:String(pick('question','q','front','recto','prompt','enonce')),term:String(pick('term','terme','word','mot')),a:String(pick('answer','reponse','a','back','verso','definition','translation','traduction')),expl:String(pick('explanation','explication','expl','note','notes')),ex:String(pick('example','exemple','ex')),hint:String(pick('hint','indice')),imp:String(pick('important','imp','keypoint')),err:String(pick('mistake','erreur','err','pitfall')),src:String(pick('source','src','reference'))};
  let tags=pick('tags','tag','labels');tags=Array.isArray(tags)?tags.map(String):tags?String(tags).split(/[,;|]/):[];
  c.tags=tags.map(t=>t.trim().toLowerCase()).filter(Boolean);
  c.d=parseDiff(pick('difficulty','difficulte','diff','level','niveau')||3);
  const opts=pick('options','choices','choix','propositions');
  if(Array.isArray(opts)&&opts.length>=2){
    c.t='mcq';c.opts=opts.map(String);const cor=pick('correct','ok','answerindex','bonne');
    c.ok=typeof cor==='number'?cor:Math.max(0,c.opts.indexOf(String(cor||c.a)));if(c.ok>=c.opts.length)c.ok=0;
    if(!c.a||c.opts.includes(c.a))c.a='';
  }else if(typeof o.tf==='boolean'||typeof K.vrai==='boolean'){c.t='tf';c.tf=typeof o.tf==='boolean'?o.tf:K.vrai;}
  else if(/\{\{.+\}\}/.test(c.q))c.t='cloze';
  else if(c.term&&!c.q)c.t='term';
  else c.t=pick('type')?parseType(pick('type')):'qa';
  if(!c.q&&!c.term)return null;
  if(!c.a&&!['mcq','tf','cloze'].includes(c.t))return null;
  return c;
}
function parseJSONImport(raw){
  let data;try{data=JSON.parse(raw);}catch(e){return {error:'JSON invalide : '+e.message.replace(/^JSON\.parse: /,'')};}
  if(data&&Array.isArray(data.decks)&&Array.isArray(data.cards))return {kind:'mnemo',decks:data.decks,cards:data.cards};
  const arr=Array.isArray(data)?data:data&&(Array.isArray(data.cards)?data.cards:Array.isArray(data.flashcards)?data.flashcards:null);
  if(!arr)return {error:'Structure non reconnue : un tableau de cartes ou un export Mnémo est attendu.'};
  const cards=arr.map(objToCard).filter(Boolean);
  const keys=[...new Set(arr.flatMap(o=>o&&typeof o==='object'&&!Array.isArray(o)?Object.keys(o):[]))].slice(0,10);
  return {kind:'list',cards,total:arr.length,name:(data&&(data.name||data.title))||'',keys};
}
function parsePlainText(raw){
  const text=String(raw).replace(/\r/g,'').trim();if(!text)return {rows:[],sep:null};
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  const seps=['::','\t',' → ',' -> ',' — ',' – ',' = ',' ; ',';',' : ',' - ',':'];
  for(const sep of seps){
    const n=lines.filter(l=>l.includes(sep)).length;
    if(n&&n>=lines.length*.6){
      const rows=lines.filter(l=>l.includes(sep)).map(l=>{const i=l.indexOf(sep);return {q:l.slice(0,i).trim().replace(/^[-*•]\s*/,''),a:l.slice(i+sep.length).trim()};}).filter(r=>r.q&&r.a);
      return {rows,sep:sep==='\t'?'tabulation':`« ${sep.trim()} »`};
    }
  }
  const blocks=text.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  if(blocks.length>=1&&blocks.every(b=>b.includes('\n')))return {rows:blocks.map(b=>{const [q,...r]=b.split('\n');return {q:q.trim(),a:r.join(' ').trim()};}),sep:'blocs séparés par une ligne vide'};
  return {rows:[],sep:null};
}

function openImport(tab='csv',preset={}){
  UI.imp={tab:tab==='json'?'json':tab==='text'?'text':'csv',raw:'',fileName:'',delim:'auto',header:true,map:[],mapSig:'',target:'new',deckId:UI.editorDeck&&deckById(UI.editorDeck)?UI.editorDeck:((DB.decks[0]||{}).id||''),name:preset.name||'',subject:preset.subject||'',preset,keepProgress:true};
  openModal({title:'Importer des cartes',size:'lg',body:impBodyHTML(),foot:impFootHTML(),handlers:{
    tab:el=>{UI.imp.tab=el.dataset.t;paintImp(true);},
    sample:()=>{UI.imp.raw=IMP_SAMPLES[UI.imp.tab];UI.imp.fileName='';UI.imp.mapSig='';if(!UI.imp.name)UI.imp.name=UI.imp.tab==='text'?'Anglais — expressions utiles':UI.imp.tab==='json'?'Bases du web':'Géographie du monde';paintImp(true);},
    header:()=>{UI.imp.header=!UI.imp.header;UI.imp.mapSig='';paintImp();},
    target:el=>{UI.imp.target=el.dataset.v;paintImp();},
    keep:()=>{UI.imp.keepProgress=!UI.imp.keepProgress;paintImp();},
    go:()=>doImport()
  }});
  bindDrop();
}
ACT['open-import']=()=>openImport('csv');
function bindDrop(){
  const z=$('#impDrop');if(!z)return;
  ['dragenter','dragover'].forEach(t=>z.addEventListener(t,e=>{e.preventDefault();z.classList.add('over');}));
  ['dragleave','drop'].forEach(t=>z.addEventListener(t,e=>{e.preventDefault();z.classList.remove('over');}));
  z.addEventListener('drop',e=>{const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)readImportFile(f);});
}
function paintImp(full){
  if(!MODAL)return;
  if(full){$('#modalBody').innerHTML=impBodyHTML();bindDrop();}
  else{$('#impCfg').innerHTML=impCfgHTML();$('#impTarget').innerHTML=impTargetHTML();}
  $('#modalFoot').innerHTML=impFootHTML();
}
function impBodyHTML(){
  const I=UI.imp;
  return `<div class="seg" role="tablist">${[['csv','CSV'],['json','JSON'],['text','Texte brut']].map(([k,l])=>`<button class="${I.tab===k?'on':''}" data-act="m:tab" data-t="${k}" role="tab" aria-selected="${I.tab===k}">${l}</button>`).join('')}</div>
  <div class="dropzone" id="impDrop">${ic('upload',22)}<div style="flex:1;min-width:180px"><b>Glissez un fichier ici</b><div class="muted" style="font-size:.85rem">${I.fileName?`Fichier chargé : ${esc(I.fileName)}`:{csv:'.csv ou .tsv (Excel, Google Sheets, Anki, Quizlet)',json:'.json — export Mnémo ou tableau de cartes',text:'.txt — une carte par ligne'}[I.tab]}</div></div><label class="btn btn-sm" style="cursor:pointer">Choisir un fichier<input type="file" hidden data-in="imp-file" accept="${{csv:'.csv,.tsv,.txt,text/csv',json:'.json,application/json',text:'.txt,.md,text/plain'}[I.tab]}"></label></div>
  <div class="field"><div class="row" style="justify-content:space-between"><label for="impRaw">Ou collez le contenu</label><button class="linkish" data-act="m:sample">Insérer un exemple</button></div>
    <textarea class="ta mono" id="impRaw" rows="7" data-in="imp-raw" style="font-size:.82rem" placeholder="${esc({csv:'Question;Réponse;Explication;Tags;Difficulté',json:'[{"question": "…", "answer": "…"}]',text:'Question :: Réponse'}[I.tab])}">${esc(I.raw)}</textarea></div>
  <div id="impCfg">${impCfgHTML()}</div>
  <div id="impTarget">${impTargetHTML()}</div>`;
}
function csvState(){
  const I=UI.imp;const P=parseCSV(I.raw,I.delim);const rows=P.rows;
  const ncol=Math.max(0,...rows.map(r=>r.length));
  const heads=I.header&&rows[0]?rows[0]:[];
  const sig=ncol+'|'+I.header+'|'+heads.join('¦');
  if(sig!==I.mapSig){
    I.mapSig=sig;const used=new Set();
    I.map=[...Array(ncol)].map((_,j)=>{let t=I.header?guessTarget(heads[j]||''):['q','a','expl','tags','diff'][j]||'';if(t&&used.has(t))t='';if(t)used.add(t);return t;});
  }
  const data=I.header?rows.slice(1):rows;
  const cards=data.map(r=>{const o={};I.map.forEach((t,j)=>{const v=(r[j]||'').trim();if(!t||!v)return;if(t==='tags')o.tags=v.split(/[,;|]/).map(x=>x.trim().toLowerCase()).filter(Boolean);else if(t==='diff')o.d=parseDiff(v);else if(t==='type')o.t=parseType(v);else o[t]=v;});
    if(!o.t)o.t=/\{\{.+\}\}/.test(o.q||'')?'cloze':o.term&&!o.q?'term':'qa';
    return (o.q||o.term)&&(o.a||o.t==='cloze')?o:null;});
  return {P,rows,data,ncol,heads,valid:cards.filter(Boolean),invalid:cards.filter(c=>!c).length};
}
function impCfgHTML(){
  const I=UI.imp;
  if(!I.raw.trim()) return `<div class="notice">${ic('info',16)}<div>${{csv:'Une ligne par carte. La première ligne peut contenir les noms de colonnes : vous associerez ensuite chaque colonne à un champ (Question, Réponse, Explication, Tag, Difficulté…).',json:'Collez un export Mnémo (decks et cartes) ou un tableau d\'objets. Clés reconnues : question, answer, explanation, example, hint, tags, difficulty, options, correct.',text:'Une carte par ligne, avec un séparateur entre la question et la réponse : « :: », tabulation, « ; », « = », « → » ou « : ». Vous pouvez aussi séparer les cartes par une ligne vide (première ligne = question).'}[I.tab]}</div></div>`;
  if(I.tab==='csv'){
    const st=csvState();
    if(!st.rows.length) return `<div class="notice bad">${ic('alert',16)}<div>Aucune ligne détectée. Vérifiez le contenu collé.</div></div>`;
    const hasFront=I.map.includes('q')||I.map.includes('term'),hasBack=I.map.includes('a');
    const prev=st.valid.slice(0,5);
    return `<div class="stack" style="gap:14px">
      <div class="row">
        <div class="field" style="flex-direction:row;align-items:center;gap:8px"><label for="impDelim" style="white-space:nowrap">Séparateur</label><select class="sel" id="impDelim" style="width:auto" data-in="imp-delim">${[['auto',`Automatique (${st.P.delim==='\t'?'tabulation':st.P.delim})`],[';','Point-virgule ;'],[',','Virgule ,'],['\t','Tabulation'],['|','Barre verticale |']].map(([v,l])=>`<option value="${v==='\t'?'tab':v}" ${(I.delim===v)?'selected':''}>${l}</option>`).join('')}</select></div>
        <div class="row" style="gap:8px"><button class="switch ${I.header?'on':''}" data-act="m:header" role="switch" aria-checked="${I.header}" aria-label="Première ligne d'en-têtes"></button><span style="font-size:.9rem">La première ligne contient les noms de colonnes</span></div>
      </div>
      <div><span class="lbl">Correspondance des colonnes</span>
      <div class="tscroll" style="margin-top:6px"><table class="map-table"><thead><tr><th>Colonne</th><th>Exemple de valeur</th><th>Champ de la carte</th></tr></thead><tbody>
        ${[...Array(st.ncol)].map((_,j)=>`<tr><td><b>${esc(I.header&&st.heads[j]?st.heads[j]:'Colonne '+(j+1))}</b></td><td class="smp">${esc((st.data[0]||[])[j]||'—')}</td><td><select class="sel" style="min-width:170px" data-in="imp-map" data-j="${j}" aria-label="Champ pour la colonne ${j+1}">${IMP_TARGETS.map(([v,l])=>`<option value="${v}" ${I.map[j]===v?'selected':''}>${l}</option>`).join('')}</select></td></tr>`).join('')}
      </tbody></table></div></div>
      ${!hasFront||!hasBack?`<div class="notice bad">${ic('alert',16)}<div>Associez au moins une colonne à <b>Question / recto</b> (ou Terme) et une à <b>Réponse / verso</b>.</div></div>`:
      `<div><span class="lbl">Aperçu — ${plural(st.valid.length,'carte')} prête${st.valid.length>1?'s':''} à importer${st.invalid?`, ${st.invalid} ligne${st.invalid>1?'s':''} ignorée${st.invalid>1?'s':''} (incomplète${st.invalid>1?'s':''})`:''}</span>
      <div class="tscroll" style="margin-top:6px"><table class="prev-table"><thead><tr><th>Recto</th><th>Verso</th><th>Explication</th><th>Tags</th><th>Diff.</th></tr></thead><tbody>${prev.map(c=>`<tr><td title="${esc(c.q||c.term)}">${esc(c.q||c.term)}</td><td title="${esc(c.a)}">${esc(c.a||'')}</td><td>${esc(c.expl||'')}</td><td>${esc((c.tags||[]).join(', '))}</td><td>${c.d||3}</td></tr>`).join('')}</tbody></table></div></div>`}
    </div>`;
  }
  if(I.tab==='json'){
    const P=parseJSONImport(I.raw);
    if(P.error) return `<div class="notice bad">${ic('alert',16)}<div>${esc(P.error)}</div></div>`;
    if(P.kind==='mnemo') return `<div class="notice good">${ic('check',16)}<div>Export Mnémo reconnu : <b>${plural(P.decks.length,'deck')}</b> et <b>${plural(P.cards.length,'carte')}</b>. Ils seront ajoutés comme nouveaux decks.</div></div>
      <div class="row" style="gap:8px"><button class="switch ${I.keepProgress?'on':''}" data-act="m:keep" role="switch" aria-checked="${I.keepProgress}" aria-label="Conserver la progression"></button><span style="font-size:.9rem">Conserver la progression de révision</span></div>`;
    return `<div class="notice ${P.cards.length?'good':'bad'}">${ic(P.cards.length?'check':'alert',16)}<div>${P.cards.length?`${plural(P.cards.length,'carte')} reconnue${P.cards.length>1?'s':''} sur ${P.total}`:'Aucune carte reconnue'}. Clés détectées : <span class="mono">${esc(P.keys.join(', ')||'—')}</span></div></div>
      ${P.cards.length?`<div class="tscroll"><table class="prev-table"><thead><tr><th>Type</th><th>Recto</th><th>Verso</th><th>Tags</th></tr></thead><tbody>${P.cards.slice(0,5).map(c=>`<tr><td>${TYPES[c.t].short}</td><td>${esc(c.q||c.term)}</td><td>${esc(c.t==='mcq'?c.opts[c.ok]:c.a)}</td><td>${esc(c.tags.join(', '))}</td></tr>`).join('')}</tbody></table></div>`:''}`;
  }
  const P=parsePlainText(I.raw);
  if(!P.rows.length) return `<div class="notice bad">${ic('alert',16)}<div>Aucun séparateur reconnu. Écrivez une carte par ligne, par exemple <span class="mono">Question :: Réponse</span>.</div></div>`;
  return `<div class="notice good">${ic('check',16)}<div>${plural(P.rows.length,'carte')} détectée${P.rows.length>1?'s':''} · séparateur : ${esc(P.sep)}</div></div>
    <div class="tscroll"><table class="prev-table"><thead><tr><th>Recto</th><th>Verso</th></tr></thead><tbody>${P.rows.slice(0,5).map(r=>`<tr><td>${esc(r.q)}</td><td>${esc(r.a)}</td></tr>`).join('')}</tbody></table></div>`;
}
function impTargetHTML(){
  const I=UI.imp;
  if(I.tab==='json'&&I.raw.trim()&&parseJSONImport(I.raw).kind==='mnemo') return '';
  return `<div class="stack" style="gap:10px;border-top:1px solid var(--line);padding-top:14px"><span class="lbl">Destination</span>
    <div class="seg"><button class="${I.target==='new'?'on':''}" data-act="m:target" data-v="new">Nouveau deck</button><button class="${I.target==='existing'?'on':''}" data-act="m:target" data-v="existing" ${DB.decks.length?'':'disabled'}>Deck existant</button></div>
    ${I.target==='new'?`<div class="fgrid"><div class="field"><label for="impName">Nom du deck</label><input class="inp" id="impName" value="${esc(I.name)}" data-in="imp-name" placeholder="Ex. : Vocabulaire espagnol"></div><div class="field"><label for="impSubj">Matière</label><input class="inp" id="impSubj" list="subjectList3" value="${esc(I.subject)}" data-in="imp-subj" placeholder="Ex. : Espagnol"><datalist id="subjectList3">${SUBJECTS.map(s=>`<option value="${esc(s)}">`).join('')}</datalist></div></div>`
      :`<select class="sel" data-in="imp-deck" aria-label="Deck de destination">${DB.decks.map(d=>`<option value="${d.id}" ${I.deckId===d.id?'selected':''}>${esc(d.name)} (${deckCards(d.id).length} cartes)</option>`).join('')}</select>`}
  </div>`;
}
function impCount(){
  const I=UI.imp;if(!I.raw.trim())return 0;
  if(I.tab==='csv'){const st=csvState();const ok=(I.map.includes('q')||I.map.includes('term'))&&I.map.includes('a');return ok?st.valid.length:0;}
  if(I.tab==='json'){const P=parseJSONImport(I.raw);return P.error?0:P.cards.length;}
  return parsePlainText(I.raw).rows.length;
}
function impFootHTML(){const n=impCount();return `<button class="btn" data-act="m:close">Annuler</button><button class="btn btn-primary" data-act="m:go" ${n?'':'disabled'}>${ic('upload',15)}Importer ${n?plural(n,'carte'):''}</button>`;}
let impT=0;
IN['imp-raw']=el=>{UI.imp.raw=el.value;UI.imp.fileName='';clearTimeout(impT);impT=setTimeout(()=>paintImp(),200);};
IN['imp-file']=(el,e,type)=>{if(type!=='change')return;const f=el.files&&el.files[0];if(f)readImportFile(f);};
function readImportFile(f){
  if(f.size>5e6){toast('Fichier trop volumineux (5 Mo maximum)','err');return;}
  const fr=new FileReader();
  fr.onload=()=>{const I=UI.imp;I.raw=String(fr.result);I.fileName=f.name;I.mapSig='';
    if(/\.json$/i.test(f.name))I.tab='json';else if(/\.(csv|tsv)$/i.test(f.name))I.tab='csv';
    if(!I.name)I.name=f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ');
    paintImp(true);toast(`« ${f.name} » chargé`);};
  fr.onerror=()=>toast('Impossible de lire ce fichier','err');
  fr.readAsText(f);
}
IN['imp-delim']=el=>{UI.imp.delim=el.value==='tab'?'\t':el.value;UI.imp.mapSig='';paintImp();};
IN['imp-map']=el=>{const I=UI.imp;const j=Number(el.dataset.j);const v=el.value;if(v)I.map=I.map.map((t,k)=>k!==j&&t===v?'':t);I.map[j]=v;paintImp();};
IN['imp-name']=el=>{UI.imp.name=el.value;};
IN['imp-subj']=el=>{UI.imp.subject=el.value;};
IN['imp-deck']=el=>{UI.imp.deckId=el.value;};
function doImport(){
  const I=UI.imp;let list=[],name=I.name;
  if(I.tab==='json'){
    const P=parseJSONImport(I.raw);if(P.error){toast(P.error,'err');return;}
    if(P.kind==='mnemo'){importMnemo(P);return;}
    list=P.cards;if(!name&&P.name)name=P.name;
  }else if(I.tab==='csv'){list=csvState().valid;}
  else list=parsePlainText(I.raw).rows.map(r=>({t:/\{\{.+\}\}/.test(r.q)?'cloze':'qa',q:r.q,a:r.a}));
  if(!list.length){toast('Aucune carte valide à importer','err');return;}
  const now=Date.now();let d;
  if(I.target==='existing'){d=deckById(I.deckId);if(!d){toast('Choisissez un deck de destination','err');return;}}
  else{
    if(!name.trim()){const n=$('#impName');if(n){n.classList.add('err');n.focus();}toast('Donnez un nom au nouveau deck','err');return;}
    const p=I.preset||{};
    d={id:uid(),name:name.trim(),subject:I.subject.trim()||p.subject||'Général',chapter:p.chapter||'',theme:p.theme||'',level:p.level||'Lycée — 2de',lang:p.lang||'Français',color:DECK_COLORS[DB.decks.length%DECK_COLORS.length],fields:{...DEFAULT_FIELDS},created:now,updated:now,lastStudied:0};
    if(list.some(c=>c.src))d.fields.src=true;
    DB.decks.push(d);
  }
  let pos=deckCards(d.id).length;
  list.forEach(o=>DB.cards.push(makeCard(d.id,o,pos++,now)));
  d.updated=now;persist();closeModal(true);
  if(UI.gen&&isImport(UI.gen))UI.gen=newGen();
  openEditor(d.id);
  toast(`${plural(list.length,'carte')} importée${list.length>1?'s':''} dans « ${d.name} »`);
}
function importMnemo(P){
  const I=UI.imp;const now=Date.now();const idMap=new Map();
  P.decks.forEach(src=>{const d={...src,id:uid(),name:src.name||'Deck importé',subject:src.subject||'Général',level:src.level||'Lycée — 2de',lang:src.lang||'Français',chapter:src.chapter||'',theme:src.theme||'',color:src.color||DECK_COLORS[DB.decks.length%DECK_COLORS.length],fields:{...DEFAULT_FIELDS,...(src.fields||{})},created:src.created||now,updated:now,lastStudied:I.keepProgress?(src.lastStudied||0):0};idMap.set(src.id,d.id);DB.decks.push(d);});
  let n=0;
  P.cards.forEach((c,i)=>{const deckId=idMap.get(c.deckId);if(!deckId)return;const card=makeCard(deckId,{...c,t:c.type||c.t,d:c.diff||c.d},c.pos??i,c.created||now);if(I.keepProgress&&c.srs)card.srs={...newSrs(),...c.srs};DB.cards.push(card);n++;});
  persist();closeModal(true);UI.view='decks';go('decks');
  toast(`${plural(P.decks.length,'deck')} et ${plural(n,'carte')} importés`);
}

/* ---------- export ---------- */
function csvCell(v,d){v=String(v??'');return /["\n\r]/.test(v)||v.includes(d)?'"'+v.replace(/"/g,'""')+'"':v;}
function exportText(){
  const E=UI.exp;const decks=E.deck==='all'?DB.decks:DB.decks.filter(d=>d.id===E.deck);
  const cards=decks.flatMap(d=>deckCards(d.id));
  if(E.fmt==='json'){
    return JSON.stringify({app:'Mnémo',version:1,exportedAt:new Date().toISOString(),decks:decks.map(d=>({id:d.id,name:d.name,subject:d.subject,chapter:d.chapter,theme:d.theme,level:d.level,lang:d.lang,color:d.color,fields:d.fields,created:d.created,lastStudied:d.lastStudied})),
      cards:cards.map(c=>{const o={id:c.id,deckId:c.deckId,type:c.type,term:c.term,q:c.q,a:c.a,hint:c.hint,expl:c.expl,ex:c.ex,imp:c.imp,err:c.err,src:c.src,tags:c.tags,diff:c.diff,star:c.star,pos:c.pos};if(c.type==='mcq'){o.opts=c.opts;o.ok=c.ok;}if(c.type==='tf')o.tf=c.tf;if(c.image&&!c.image.startsWith('data:'))o.image=c.image;if(E.progress)o.srs=c.srs;Object.keys(o).forEach(k=>{if(o[k]===''||(Array.isArray(o[k])&&!o[k].length&&k!=='tags'))delete o[k];});return o;})},null,2);
  }
  if(E.fmt==='csv'){
    const d=E.delim;
    const head=['Deck','Type','Terme','Question','Réponse','Explication','Exemple','Indice','Point important','Erreur fréquente','Source','Tags','Difficulté'];
    const rows=cards.map(c=>[(deckById(c.deckId)||{}).name,TYPES[c.type].label,c.term,c.q,['mcq','tf'].includes(c.type)?answerText(c):c.a,c.expl,c.ex,c.hint,c.imp,c.err,c.src,c.tags.join(', '),c.diff]);
    return [head,...rows].map(r=>r.map(v=>csvCell(v,d)).join(d)).join('\n');
  }
  return decks.map(dk=>`# ${dk.name}\n`+deckCards(dk.id).map(c=>`${frontText(c).replace(/\n/g,' ')} :: ${answerText(c).replace(/\n/g,' ')}`).join('\n')).join('\n\n');
}
function expBodyHTML(){
  const E=UI.exp;const out=exportText();const n=(E.deck==='all'?DB.cards:deckCards(E.deck)).length;
  return `<div class="fgrid">
    <div class="field"><label for="expDeck">Contenu</label><select class="sel" id="expDeck" data-in="exp-deck"><option value="all">Tous les decks (${DB.cards.length} cartes)</option>${DB.decks.map(d=>`<option value="${d.id}" ${E.deck===d.id?'selected':''}>${esc(d.name)} (${deckCards(d.id).length})</option>`).join('')}</select></div>
    <div class="field"><span class="lbl">Format</span><div class="seg">${[['csv','CSV'],['json','JSON'],['text','Texte']].map(([k,l])=>`<button class="${E.fmt===k?'on':''}" data-act="m:fmt" data-f="${k}">${l}</button>`).join('')}</div></div>
    ${E.fmt==='csv'?`<div class="field"><label for="expDelim">Séparateur</label><select class="sel" id="expDelim" data-in="exp-delim"><option value=";" ${E.delim===';'?'selected':''}>Point-virgule (Excel FR)</option><option value="," ${E.delim===','?'selected':''}>Virgule</option><option value="tab" ${E.delim==='\t'?'selected':''}>Tabulation (Anki)</option></select></div>`:''}
    ${E.fmt==='json'?`<div class="field"><span class="lbl">Options</span><div class="row" style="gap:8px;min-height:40px"><button class="switch ${E.progress?'on':''}" data-act="m:prog" role="switch" aria-checked="${E.progress}" aria-label="Inclure la progression"></button><span style="font-size:.9rem">Inclure la progression</span></div></div>`:''}
  </div>
  <div class="field"><div class="row" style="justify-content:space-between"><label for="expOut">Résultat</label><span class="muted" style="font-size:.8rem">${plural(n,'carte')} · ${Math.max(1,Math.round(new Blob([out]).size/1024))} Ko</span></div>
    <textarea class="ta out" id="expOut" readonly rows="12">${esc(out)}</textarea>
    <small>${E.fmt==='json'?'Réimportez ce JSON dans Mnémo pour restaurer decks et progression.':E.fmt==='csv'?'Collez dans un fichier .csv, ou dans un tableur.':'Format « recto :: verso », réimportable via Texte brut.'}</small></div>`;
}
ACT['open-export']=()=>{
  UI.exp=UI.exp||{deck:'all',fmt:'csv',delim:';',progress:true};
  if(UI.view==='editor'&&UI.editorMode==='deck'&&deckById(UI.editorDeck))UI.exp.deck=UI.editorDeck;
  const paint=()=>{$('#modalBody').innerHTML=expBodyHTML();};
  openModal({title:'Exporter des cartes',size:'lg',body:expBodyHTML(),
    foot:`<button class="btn" data-act="m:close">Fermer</button><button class="btn btn-primary" data-act="m:copy">${ic('copy',15)}Copier le contenu</button>`,
    handlers:{fmt:el=>{UI.exp.fmt=el.dataset.f;paint();},prog:()=>{UI.exp.progress=!UI.exp.progress;paint();},
      copy:()=>{const ta=$('#expOut');const txt=ta.value;
        const fallback=()=>{ta.focus();ta.select();toast('Texte sélectionné : copiez-le avec Ctrl+C (⌘+C)','info');};
        try{navigator.clipboard.writeText(txt).then(()=>toast('Contenu copié dans le presse-papiers'),fallback);}catch(e){fallback();}}}});
  MODAL.paint=paint;
};
IN['exp-deck']=el=>{UI.exp.deck=el.value;MODAL&&MODAL.paint&&MODAL.paint();};
IN['exp-delim']=el=>{UI.exp.delim=el.value==='tab'?'\t':el.value;MODAL&&MODAL.paint&&MODAL.paint();};

/* ---------- démarrage ---------- */
(function init(){
  applySettings();renderTopbar();
  const h=(location.hash||'').slice(1);if(TITLES[h])UI.view=h;
  if(!DB.decks.length&&UI.view==='home'){/* état vide géré par les vues */}
  render();
  persist();
  if(CONTENT_UPDATED)toast('Decks Réseaux mis à jour : modules 1 à 3, progression conservée');
})();
</script>
